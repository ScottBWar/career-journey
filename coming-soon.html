<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon — Scott Warner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      background: #05060f;
      color: #fff;
    }

    #stars {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: block;
    }

    .glow {
      position: fixed;
      inset: 0;
      z-index: 1;
      background:
        radial-gradient(circle at 20% 30%, rgba(129, 140, 248, 0.25), transparent 45%),
        radial-gradient(circle at 80% 70%, rgba(236, 72, 153, 0.22), transparent 45%),
        radial-gradient(circle at 50% 100%, rgba(45, 212, 191, 0.18), transparent 50%);
      pointer-events: none;
      animation: drift 18s ease-in-out infinite alternate;
    }

    @keyframes drift {
      from { transform: scale(1) translateY(0); }
      to   { transform: scale(1.15) translateY(-3%); }
    }

    .container {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .eyebrow {
      font-size: clamp(0.7rem, 2vw, 0.9rem);
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 1.4rem;
      opacity: 0;
      animation: rise 1s ease 0.2s forwards;
    }

    .title {
      font-size: clamp(2.6rem, 11vw, 7rem);
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(120deg, #a5b4fc, #f0abfc, #5eead4, #a5b4fc);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 8s ease infinite, rise 1s ease 0.35s both;
      filter: drop-shadow(0 8px 40px rgba(129, 140, 248, 0.4));
    }

    @keyframes shimmer {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .subtitle {
      margin-top: 1.5rem;
      font-size: clamp(0.95rem, 2.5vw, 1.35rem);
      font-weight: 400;
      color: rgba(255, 255, 255, 0.75);
      letter-spacing: 0.05em;
      max-width: 36ch;
      opacity: 0;
      animation: rise 1s ease 0.55s forwards;
    }

    .card {
      margin-top: 2.6rem;
      display: flex;
      gap: clamp(0.6rem, 2vw, 1.4rem);
      padding: 1.2rem 1.6rem;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      opacity: 0;
      animation: rise 1s ease 0.75s forwards;
    }

    .unit {
      min-width: 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .unit .num {
      font-size: clamp(1.6rem, 6vw, 2.6rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .unit .label {
      margin-top: 0.3rem;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.55);
    }

    .unit + .unit { border-left: 1px solid rgba(255, 255, 255, 0.12); padding-left: clamp(0.6rem, 2vw, 1.4rem); }

    .signature {
      margin-top: 2.4rem;
      font-size: 0.8rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.55);
      opacity: 0;
      animation: rise 1s ease 0.95s forwards;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .btn-game {
      margin-top: 2.2rem;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.95rem 2.4rem;
      border-radius: 999px;
      font: inherit;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #05060f;
      background: linear-gradient(120deg, #a5b4fc, #f0abfc, #5eead4);
      background-size: 200% 200%;
      border: none;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 12px 34px rgba(165, 180, 252, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      opacity: 0;
      animation: rise 1s ease 0.85s forwards, shimmer 8s ease infinite;
    }

    .btn-game:hover {
      transform: translateY(-3px) scale(1.04);
      box-shadow: 0 18px 48px rgba(240, 171, 252, 0.55);
    }

    .btn-game:active { transform: translateY(-1px) scale(1.0); }
  </style>
</head>
<body>
  <canvas id="stars"></canvas>
  <div class="glow"></div>

  <div class="container">
    <p class="eyebrow">The Cool Experiment</p>
    <h1 class="title">Coming Soon</h1>
    <p class="subtitle">Something new is taking shape. A fresh take on the journey is on its way.</p>

    <div class="card" aria-label="Countdown until launch">
      <div class="unit"><span class="num" id="d">00</span><span class="label">Days</span></div>
      <div class="unit"><span class="num" id="h">00</span><span class="label">Hours</span></div>
      <div class="unit"><span class="num" id="m">00</span><span class="label">Minutes</span></div>
      <div class="unit"><span class="num" id="s">00</span><span class="label">Seconds</span></div>
    </div>

    <a class="btn-game" href="game.html">🎮 Game</a>

    <div class="signature">— Scott Warner</div>
  </div>

  <script>
    // --- Interactive starfield -------------------------------------------
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let stars = [], w, h, mouse = { x: 0, y: 0 };

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
      const count = Math.min(220, Math.floor((w * h) / 9000));
      stars = Array.from({ length: count }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        z: Math.random() * 0.8 + 0.2,
        r: Math.random() * 1.4 + 0.3,
      }));
    }

    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', e => {
      mouse.x = (e.clientX / w - 0.5);
      mouse.y = (e.clientY / h - 0.5);
    });
    resize();

    function draw() {
      ctx.clearRect(0, 0, w, h);
      for (const s of stars) {
        s.x += s.z * 0.15 + mouse.x * s.z * 1.2;
        s.y += s.z * 0.05 + mouse.y * s.z * 1.2;
        if (s.x > w) s.x = 0; if (s.x < 0) s.x = w;
        if (s.y > h) s.y = 0; if (s.y < 0) s.y = h;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${0.3 + s.z * 0.6})`;
        ctx.fill();
      }
      requestAnimationFrame(draw);
    }
    draw();

    // --- Countdown (30 days out) -----------------------------------------
    const target = new Date(Date.now() + 30 * 24 * 60 * 60 * 1000);
    const pad = n => String(n).padStart(2, '0');

    function tick() {
      let diff = Math.max(0, target - new Date());
      const days = Math.floor(diff / 86400000); diff -= days * 86400000;
      const hours = Math.floor(diff / 3600000); diff -= hours * 3600000;
      const mins = Math.floor(diff / 60000); diff -= mins * 60000;
      const secs = Math.floor(diff / 1000);
      document.getElementById('d').textContent = pad(days);
      document.getElementById('h').textContent = pad(hours);
      document.getElementById('m').textContent = pad(mins);
      document.getElementById('s').textContent = pad(secs);
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
