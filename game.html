<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beach Brawl — Party vs. The High Seas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; overflow: hidden;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      background: linear-gradient(180deg, #1b1145 0%, #5b2a86 32%, #c2557b 58%, #ef8f6e 80%, #ffd9a0 100%);
      color: #fff; user-select: none; -webkit-user-select: none;
    }
    #renderCanvas { position: fixed; inset: 0; width: 100%; height: 100%; outline: none; touch-action: none; z-index: 0; }

    #ui { position: fixed; inset: 0; z-index: 2; pointer-events: none;
          display: flex; flex-direction: column; justify-content: space-between;
          padding: clamp(0.6rem, 1.6vw, 1.3rem); }

    /* enemy plates */
    .enemies { display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap; pointer-events: auto; }
    .eplate {
      min-width: 170px; max-width: 240px; flex: 1 1 180px;
      background: linear-gradient(180deg, rgba(20,16,60,0.85), rgba(12,10,36,0.85));
      border: 1px solid rgba(255,255,255,0.22); border-radius: 10px; padding: 0.5rem 0.7rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45); transition: opacity 0.4s, transform 0.2s;
    }
    .eplate.dead { opacity: 0.3; }
    .eplate.targetable { cursor: pointer; }
    .eplate.targetable:hover { transform: translateY(-3px); border-color: #fcd34d; box-shadow: 0 8px 28px rgba(252,211,77,0.4); }
    .eplate .row { display: flex; justify-content: space-between; align-items: baseline; gap: 0.4rem; }
    .eplate .name { font-weight: 700; font-size: 0.85rem; letter-spacing: 0.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .eplate .hpnum { font-size: 0.7rem; color: rgba(255,255,255,0.65); font-variant-numeric: tabular-nums; }

    .bar { height: 9px; border-radius: 5px; background: rgba(0,0,0,0.45); overflow: hidden; margin-top: 0.35rem; border: 1px solid rgba(255,255,255,0.14); }
    .bar > i { display: block; height: 100%; width: 100%; transition: width 0.45s ease; }
    .bar.hp > i  { background: linear-gradient(90deg, #f87171, #fca5a5); }
    .bar.php > i { background: linear-gradient(90deg, #34d399, #6ee7b7); }
    .bar.mp > i  { background: linear-gradient(90deg, #60a5fa, #93c5fd); }

    .bottom { display: flex; gap: 0.8rem; align-items: flex-end; justify-content: space-between; }

    /* party panel */
    .party { pointer-events: auto; display: flex; flex-direction: column; gap: 0.4rem; min-width: 250px; max-width: 340px; flex: 1; }
    .pmember {
      background: linear-gradient(180deg, rgba(20,16,60,0.88), rgba(12,10,36,0.9));
      border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; padding: 0.45rem 0.7rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45); transition: border-color 0.2s, transform 0.15s; cursor: default;
    }
    .pmember.active { border-color: #fcd34d; box-shadow: 0 0 0 1px #fcd34d, 0 8px 28px rgba(252,211,77,0.35); transform: translateX(6px); }
    .pmember.dead { opacity: 0.4; }
    .pmember.targetable { cursor: pointer; }
    .pmember.targetable:hover { border-color: #6ee7b7; }
    .pmember .row { display: flex; justify-content: space-between; align-items: baseline; }
    .pmember .name { font-weight: 700; font-size: 0.82rem; letter-spacing: 0.03em; }
    .pmember .role { font-size: 0.65rem; color: rgba(255,255,255,0.5); letter-spacing: 0.1em; text-transform: uppercase; }
    .pmember .nums { font-size: 0.66rem; color: rgba(255,255,255,0.6); font-variant-numeric: tabular-nums; }
    .twobar { display: grid; grid-template-columns: 1fr auto; gap: 0.4rem; align-items: center; }

    /* command menu */
    .menu { pointer-events: auto; width: min(280px, 44vw);
      background: linear-gradient(180deg, rgba(20,16,60,0.92), rgba(12,10,36,0.94));
      border: 1px solid rgba(255,255,255,0.26); border-radius: 12px; padding: 0.45rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .menu .title { font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.5); padding: 0.25rem 0.6rem 0.4rem; }
    .menu .cmd { display: flex; justify-content: space-between; align-items: center; width: 100%; text-align: left;
      font: inherit; font-weight: 500; color: #fff; background: transparent; border: none; border-radius: 8px;
      padding: 0.5rem 0.75rem; cursor: pointer; letter-spacing: 0.03em; transition: background 0.12s, transform 0.06s; }
    .menu .cmd:hover:not(:disabled) { background: rgba(129,140,248,0.28); }
    .menu .cmd:active:not(:disabled) { transform: scale(0.98); }
    .menu .cmd:disabled { opacity: 0.32; cursor: not-allowed; }
    .menu .cmd .cost { font-size: 0.74rem; color: #93c5fd; }
    .menu .cmd .cost.qty { color: #fcd34d; }
    .menu .cmd .cost.hp { color: #6ee7b7; }
    .menu .cmd.back { color: rgba(255,255,255,0.6); }

    .message { position: fixed; left: 50%; bottom: 210px; transform: translateX(-50%); z-index: 3; pointer-events: none;
      padding: 0.5rem 1.3rem; background: rgba(8,6,24,0.78); border: 1px solid rgba(255,255,255,0.2); border-radius: 999px;
      font-size: clamp(0.8rem, 2.2vw, 1rem); letter-spacing: 0.02em; max-width: 92vw; text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45); }

    .float { position: fixed; z-index: 4; pointer-events: none; font-weight: 700; font-size: 1.6rem;
      text-shadow: 0 2px 6px rgba(0,0,0,0.7); transform: translate(-50%, -50%); animation: floatUp 0.95s ease-out forwards; }
    @keyframes floatUp { 0%{opacity:0;transform:translate(-50%,-30%) scale(0.6);} 20%{opacity:1;transform:translate(-50%,-90%) scale(1.15);} 100%{opacity:0;transform:translate(-50%,-200%) scale(1);} }

    #end { position: fixed; inset: 0; z-index: 5; display: none; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; background: rgba(5,4,18,0.72); backdrop-filter: blur(4px); }
    #end.show { display: flex; }
    #end h1 { font-size: clamp(2.4rem, 10vw, 5rem); font-weight: 700;
      background: linear-gradient(120deg, #a5b4fc, #f0abfc, #5eead4); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    #end p { margin-top: 0.8rem; color: rgba(255,255,255,0.8); letter-spacing: 0.04em; max-width: 32ch; }
    #end .actions { margin-top: 2rem; display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
    .pill { font: inherit; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; padding: 0.85rem 2rem; border-radius: 999px;
      border: none; cursor: pointer; color: #05060f; background: linear-gradient(120deg, #a5b4fc, #f0abfc, #5eead4);
      box-shadow: 0 10px 30px rgba(165,180,252,0.4); text-decoration: none; }
    .pill.ghost { color: #fff; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); box-shadow: none; }
    .pill:hover { transform: translateY(-2px); }

    #intro { position: fixed; inset: 0; z-index: 6; display: flex; align-items: center; justify-content: center; pointer-events: none; }
    #intro .vs { text-align: center; animation: introFade 3s ease forwards; text-shadow: 0 6px 30px rgba(0,0,0,0.6); padding: 1rem; }
    #intro .who { font-size: clamp(1.2rem, 4.5vw, 2.4rem); font-weight: 700; letter-spacing: 0.08em; }
    #intro .sub { font-size: clamp(0.8rem, 2.6vw, 1.1rem); color: rgba(255,255,255,0.85); margin-top: 0.3rem; }
    #intro .x { font-size: clamp(1rem, 4vw, 1.6rem); color: #fcd34d; letter-spacing: 0.4em; margin: 0.7rem 0; }
    @keyframes introFade { 0%{opacity:0;transform:scale(0.85);} 18%{opacity:1;transform:scale(1);} 78%{opacity:1;transform:scale(1);} 100%{opacity:0;transform:scale(1.08);} }

    .hint { position: fixed; top: 0.6rem; left: 0.8rem; z-index: 3; font-size: 0.7rem; color: rgba(255,255,255,0.45); letter-spacing: 0.06em; }
    .back-link { position: fixed; top: 0.6rem; right: 0.8rem; z-index: 3; pointer-events: auto; color: rgba(255,255,255,0.7); text-decoration: none; font-size: 0.78rem; }
    .back-link:hover { color: #fff; }
    @media (max-width: 640px) { .message { bottom: 188px; } .menu { width: 46vw; } }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <a class="back-link" href="coming-soon.html">← Back</a>
  <div class="hint">Beach Brawl</div>

  <div id="ui">
    <div class="enemies" id="enemies"></div>
    <div class="bottom">
      <div class="party" id="party"></div>
      <div class="menu" id="menu"></div>
    </div>
  </div>

  <div class="message" id="message">The tide brings monsters...</div>

  <div id="intro">
    <div class="vs">
      <div class="who">THE BEACH PARTY</div>
      <div class="sub" id="introParty"></div>
      <div class="x">— VS —</div>
      <div class="who">THE HIGH SEAS</div>
      <div class="sub" id="introEnemies"></div>
    </div>
  </div>

  <div id="end">
    <h1 id="endTitle">Victory!</h1>
    <p id="endText"></p>
    <div class="actions">
      <button class="pill" onclick="location.reload()">Rematch</button>
      <a class="pill ghost" href="coming-soon.html">Back to Site</a>
    </div>
  </div>

  <script>
  // =====================================================================
  //  BEACH BRAWL — party-vs-enemies turn battle in Babylon.js
  // =====================================================================
  const canvas = document.getElementById('renderCanvas');
  const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
  const V3 = BABYLON.Vector3, Color3 = BABYLON.Color3, MB = BABYLON.MeshBuilder;

  const rnd  = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
  const wait = (ms) => new Promise(r => setTimeout(r, ms));
  const easeInOut = (k) => (k < 0.5 ? 2*k*k : 1 - Math.pow(-2*k+2, 2)/2);
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const shuffle = (a) => a.map(v => [Math.random(), v]).sort((x, y) => x[0]-y[0]).map(p => p[1]);
  const el = id => document.getElementById(id);

  // =====================================================================
  //  SCENE
  // =====================================================================
  const scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color4(0, 0, 0, 0);
  scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
  scene.fogColor = new Color3(0.6, 0.45, 0.45);
  scene.fogDensity = 0.009;

  const camera = new BABYLON.ArcRotateCamera('cam', -Math.PI/2 - 0.52, 1.03, 25, new V3(0, 1.7, 0), scene);
  camera.lowerRadiusLimit = camera.upperRadiusLimit = 25;

  const hemi = new BABYLON.HemisphericLight('hemi', new V3(0.1, 1, 0.1), scene);
  hemi.intensity = 0.9; hemi.groundColor = new Color3(0.35, 0.3, 0.25);
  const sun = new BABYLON.DirectionalLight('sun', new V3(-0.5, -1, 0.3), scene);
  sun.intensity = 1.05; sun.diffuse = new Color3(1.0, 0.86, 0.72);

  function M(name, hex, opt = {}) {
    const m = new BABYLON.StandardMaterial(name, scene);
    m.diffuseColor = Color3.FromHexString(hex);
    const s = opt.spec ?? 0.15; m.specularColor = new Color3(s, s, s);
    if (opt.emissive) m.emissiveColor = Color3.FromHexString(opt.emissive);
    if (opt.alpha != null) m.alpha = opt.alpha;
    if (opt.specPower) m.specularPower = opt.specPower;
    return m;
  }
  function attach(mesh, parent, m, x = 0, y = 0, z = 0) { mesh.material = m; mesh.parent = parent; mesh.position.set(x, y, z); return mesh; }

  // shared particle flare
  const flare = (() => {
    const dt = new BABYLON.DynamicTexture('flare', 64, scene, false);
    const c = dt.getContext();
    const g = c.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.4, 'rgba(255,255,255,0.55)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g; c.fillRect(0, 0, 64, 64); dt.hasAlpha = true; dt.update(); return dt;
  })();

  // ---- beach + ocean ---------------------------------------------------
  const sand = MB.CreateGround('sand', { width: 80, height: 50, subdivisions: 1 }, scene);
  sand.material = M('sandMat', '#e7c890', { spec: 0.05 });
  sand.position.z = 4;
  const ocean = MB.CreateGround('ocean', { width: 200, height: 120, subdivisions: 40 }, scene);
  const oceanMat = M('oceanMat', '#15486b', { spec: 0.9, specPower: 64, emissive: '#0a2740' });
  ocean.material = oceanMat; ocean.position.set(0, -0.15, -28);
  const oceanBase = ocean.getVerticesData(BABYLON.VertexBuffer.PositionKind).slice();
  // a little beach decor
  [['#ff7e6b', -7, 6.5], ['#ffd166', 6, 7], ['#5eead4', 0, 8]].forEach(([hex, x, z], i) => {
    const star = MB.CreateCylinder('star', { height: 0.1, diameter: 0.9, tessellation: 5 }, scene);
    star.material = M('starMat' + i, hex); star.rotation.x = Math.PI / 2; star.position.set(x, 0.06, z);
  });

  // =====================================================================
  //  MODEL BUILDERS  (each returns { node, idle })
  // =====================================================================
  // palette
  const P = {
    skin: M('skin', '#d9a06b'), skin2: M('skin2', '#cf9a78'),
    dark: M('dark', '#2a2018'), steel: M('steel', '#c9d2dc', { spec: 0.8 }),
    gold: M('gold', '#d9a521', { emissive: '#4a3606' }),
  };

  function buildPirate() {
    const r = new BABYLON.TransformNode('pirate', scene);
    const coat = M('coat', '#7a1f1f'), coat2 = M('coat2', '#9c2a2a'), beard = M('beardP', '#7a3b12');
    attach(MB.CreateCylinder('lL', { height: 1.1, diameter: 0.34 }, scene), r, P.dark, -0.22, 0.55, 0);
    attach(MB.CreateCylinder('lR', { height: 1.1, diameter: 0.34 }, scene), r, P.dark, 0.22, 0.55, 0);
    attach(MB.CreateBox('torso', { width: 0.95, height: 1.15, depth: 0.6 }, scene), r, coat, 0, 1.6, 0);
    attach(MB.CreateBox('sash', { width: 1.0, height: 0.22, depth: 0.62 }, scene), r, P.gold, 0, 1.3, 0);
    const aL = attach(MB.CreateCylinder('aL', { height: 0.95, diameter: 0.3 }, scene), r, coat2, -0.62, 1.6, 0); aL.rotation.z = 0.25;
    const arm = new BABYLON.TransformNode('aRpiv', scene); arm.parent = r; arm.position.set(0.6, 2.0, 0);
    attach(MB.CreateCylinder('aR', { height: 0.95, diameter: 0.3 }, scene), arm, coat2, 0, -0.45, 0);
    attach(MB.CreateSphere('head', { diameter: 0.62 }, scene), r, P.skin, 0, 2.5, 0);
    attach(MB.CreateBox('beard', { width: 0.5, height: 0.4, depth: 0.32 }, scene), r, beard, 0, 2.25, 0.18);
    attach(MB.CreateBox('patch', { width: 0.18, height: 0.16, depth: 0.05 }, scene), r, P.dark, 0.14, 2.57, 0.3);
    attach(MB.CreateCylinder('brim', { height: 0.08, diameter: 0.95 }, scene), r, P.dark, 0, 2.83, 0);
    attach(MB.CreateSphere('htop', { diameter: 0.62, slice: 0.5 }, scene), r, P.dark, 0, 2.85, 0);
    attach(MB.CreateBox('skull', { width: 0.16, height: 0.16, depth: 0.05 }, scene), r, M('skullP', '#f2ead9', { emissive: '#3a3528' }), 0, 2.97, 0.3);
    const sw = new BABYLON.TransformNode('swR', scene); sw.parent = arm; sw.position.set(0, -0.95, 0.1); sw.rotation.x = -0.4;
    attach(MB.CreateBox('blade', { width: 0.08, height: 1.3, depth: 0.16 }, scene), sw, P.steel, 0, 0.55, 0);
    attach(MB.CreateBox('guard', { width: 0.32, height: 0.1, depth: 0.22 }, scene), sw, P.gold, 0, -0.05, 0);
    return { node: r, arm };
  }

  function buildSwordsman() { // Cloud-inspired: spiky blond hair, big buster sword
    const r = new BABYLON.TransformNode('swordsman', scene);
    const navy = M('navy', '#2c3a52'), navy2 = M('navy2', '#3a4d6b'), hair = M('hair', '#e7d27a', { emissive: '#4a4010' });
    attach(MB.CreateCylinder('lL', { height: 1.15, diameter: 0.32 }, scene), r, M('pant', '#1f2733'), -0.22, 0.57, 0);
    attach(MB.CreateCylinder('lR', { height: 1.15, diameter: 0.32 }, scene), r, M('pant', '#1f2733'), 0.22, 0.57, 0);
    attach(MB.CreateBox('torso', { width: 0.92, height: 1.2, depth: 0.55 }, scene), r, navy, 0, 1.62, 0);
    attach(MB.CreateBox('belt', { width: 0.96, height: 0.18, depth: 0.57 }, scene), r, M('belt', '#7a5230'), 0, 1.25, 0);
    attach(MB.CreateSphere('pauldron', { diameter: 0.62, slice: 0.6 }, scene), r, P.steel, -0.55, 2.05, 0);
    const aL = attach(MB.CreateCylinder('aL', { height: 0.95, diameter: 0.28 }, scene), r, navy2, -0.6, 1.6, 0); aL.rotation.z = 0.22;
    const arm = new BABYLON.TransformNode('aRpiv', scene); arm.parent = r; arm.position.set(0.62, 2.02, 0);
    attach(MB.CreateCylinder('aR', { height: 0.95, diameter: 0.28 }, scene), arm, navy2, 0, -0.45, 0);
    attach(MB.CreateSphere('head', { diameter: 0.6 }, scene), r, P.skin2, 0, 2.5, 0);
    // spiky hair — a crown of cones
    const spikes = [[0,0.45,0, 0,0,0],[ -0.18,0.42,0.05, 0,0,0.5],[0.18,0.42,0.05, 0,0,-0.5],[0,0.4,0.22, 0.6,0,0],[0,0.4,-0.2, -0.6,0,0],[-0.22,0.3,-0.05,0,0,0.9],[0.22,0.3,-0.05,0,0,-0.9]];
    spikes.forEach((s, i) => { const c = attach(MB.CreateCylinder('hair'+i, { height: 0.6, diameterTop: 0, diameterBottom: 0.26 }, scene), r, hair, s[0], 2.72 + s[1]*0.2, s[2]); c.rotation.set(s[3], s[4], s[5]); });
    // the big buster sword (held), its own pivot
    const sw = new BABYLON.TransformNode('swR', scene); sw.parent = arm; sw.position.set(0.1, -0.95, 0.12); sw.rotation.x = -0.5;
    attach(MB.CreateBox('blade', { width: 0.38, height: 2.7, depth: 0.09 }, scene), sw, M('busterBlade', '#cdd6e0', { spec: 0.9, specPower: 80 }), 0, 1.25, 0);
    attach(MB.CreateBox('edge', { width: 0.1, height: 2.6, depth: 0.11 }, scene), sw, M('busterEdge', '#9aa6b4', { spec: 0.9 }), 0.14, 1.25, 0);
    attach(MB.CreateBox('guard', { width: 0.5, height: 0.14, depth: 0.2 }, scene), sw, P.steel, 0, -0.1, 0);
    attach(MB.CreateCylinder('grip', { height: 0.5, diameter: 0.1 }, scene), sw, P.dark, 0, -0.4, 0);
    return { node: r, arm };
  }

  function buildHealer() { // tide priestess
    const r = new BABYLON.TransformNode('healer', scene);
    const robe = M('robe', '#2fae9a', { emissive: '#0c3a33' }), robe2 = M('robe2', '#7fe3d4'), hairC = M('hairC', '#37c0e0', { emissive: '#0a3a48' });
    attach(MB.CreateCylinder('robe', { height: 1.9, diameterTop: 0.5, diameterBottom: 1.4 }, scene), r, robe, 0, 0.95, 0);
    attach(MB.CreateCylinder('trim', { height: 0.2, diameterTop: 1.32, diameterBottom: 1.42 }, scene), r, robe2, 0, 0.12, 0);
    const aL = attach(MB.CreateCylinder('aL', { height: 0.8, diameter: 0.22 }, scene), r, robe, -0.5, 1.5, 0); aL.rotation.z = 0.4;
    const aR = attach(MB.CreateCylinder('aR', { height: 0.8, diameter: 0.22 }, scene), r, robe, 0.5, 1.5, 0); aR.rotation.z = -0.4;
    attach(MB.CreateSphere('head', { diameter: 0.55 }, scene), r, P.skin, 0, 2.25, 0);
    // flowing hair
    attach(MB.CreateBox('hairBack', { width: 0.6, height: 1.1, depth: 0.25 }, scene), r, hairC, 0, 1.9, -0.18);
    attach(MB.CreateSphere('hairTop', { diameter: 0.6, slice: 0.6 }, scene), r, hairC, 0, 2.42, 0);
    // halo
    const halo = attach(MB.CreateTorus('halo', { diameter: 0.7, thickness: 0.05, tessellation: 24 }, scene), r, M('halo', '#fff6c2', { emissive: '#fff0a0' }), 0, 2.85, 0);
    halo.rotation.x = Math.PI / 2.3;
    // staff with glowing shell orb
    const staff = new BABYLON.TransformNode('staffPiv', scene); staff.parent = r; staff.position.set(0.72, 1.6, 0.1);
    attach(MB.CreateCylinder('staff', { height: 2.0, diameter: 0.08 }, scene), staff, M('staffMat', '#b07a3a'), 0, 0, 0);
    const orb = attach(MB.CreateSphere('orb', { diameter: 0.42 }, scene), staff, M('orbMat', '#9be7ff', { emissive: '#3fb8ff' }), 0, 1.05, 0);
    return { node: r, halo, orb, staffPiv: staff, idle(t) { halo.rotation.z = t * 1.2; orb.scaling.setAll(1 + Math.sin(t * 3) * 0.08); } };
  }

  // ---------- ENEMIES ----------
  function buildShark() {
    const r = new BABYLON.TransformNode('eShark', scene);
    const grey = M('shGrey', '#6f7f8c', { spec: 0.3 }), belly = M('shBelly', '#d8dfe4'), drk = M('shDark', '#3c4750');
    attach(MB.CreateSphere('b', { diameterX: 3.4, diameterY: 1.3, diameterZ: 1.4, segments: 14 }, scene), r, grey, 0, 0.9, 0);
    attach(MB.CreateSphere('bl', { diameterX: 2.8, diameterY: 0.85, diameterZ: 1.1, segments: 12 }, scene), r, belly, 0, 0.65, 0);

  const PARTY_DEFS = [

  let t = 0;
  scene.onBeforeRenderObservable.add(() => {

    camera.alpha = -Math.PI/2 - 0.52 + Math.sin(t * 0.22) * 0.04;
    for (const a of actors) {
      if (!a.alive || a._busy) continue;
      a.node.position.y = a.baseY + Math.sin(t * 1.5 + a.phase) * 0.05;
      if (a.idle) a.idle(t);
    }
    const pos = ocean.getVerticesData(BABYLON.VertexBuffer.PositionKind);
    for (let i = 0; i < pos.length; i += 3) { const x = oceanBase[i], z = oceanBase[i+2]; pos[i+1] = Math.sin(x*0.25 + t*1.3)*0.35 + Math.cos(z*0.3 + t*1.0)*0.35; }

  });

  // =====================================================================
  //  FX HELPERS
  // =====================================================================
  function tween(apply, ms, ease = easeInOut) {
    return new Promise(res => { let acc = 0; const obs = scene.onBeforeRenderObservable.add(() => {
      acc += engine.getDeltaTime(); const k = Math.min(1, acc / ms); apply(ease(k));
      if (k >= 1) { scene.onBeforeRenderObservable.remove(obs); res(); } }); });
  }
  function moveTo(node, to, ms) { const from = node.position.clone(); return tween(k => { node.position = V3.Lerp(from, to, k); }, ms); }
  function rotTo(node, axis, from, to, ms) { return tween(k => { node.rotation[axis] = from + (to - from) * k; }, ms); }
  function hitFlash(node, hex, ms = 180) {
    const col = Color3.FromHexString(hex);
    const meshes = node.getChildMeshes().filter(m => m.material);
    const saved = meshes.map(m => m.material.emissiveColor.clone());
    meshes.forEach(m => m.material.emissiveColor = col);
    setTimeout(() => meshes.forEach((m, i) => m.material.emissiveColor = saved[i]), ms);
  }
  function burst(pos, hexA, hexB, count = 70, power = 7, gravity = -8) {
    const ps = new BABYLON.ParticleSystem('burst', count, scene);
    ps.particleTexture = flare; ps.emitter = pos.clone();
    ps.minEmitBox = new V3(-0.2, -0.2, -0.2); ps.maxEmitBox = new V3(0.2, 0.2, 0.2);
    ps.color1 = BABYLON.Color4.FromHexString(hexA + 'ff'); ps.color2 = BABYLON.Color4.FromHexString(hexB + 'ff');
    ps.colorDead = new BABYLON.Color4(0, 0, 0, 0);
    ps.minSize = 0.25; ps.maxSize = 0.9; ps.minLifeTime = 0.3; ps.maxLifeTime = 0.7; ps.emitRate = count * 8;
    ps.blendMode = BABYLON.ParticleSystem.BLENDMODE_ONEONE; ps.gravity = new V3(0, gravity, 0);
    ps.direction1 = new V3(-1, 1, -1); ps.direction2 = new V3(1, 1.5, 1);
    ps.minEmitPower = power * 0.5; ps.maxEmitPower = power; ps.minAngularSpeed = 0; ps.maxAngularSpeed = Math.PI;
    ps.targetStopDuration = 0.18; ps.disposeOnStop = true; ps.start();
  }
  const FX = {

        <div class="twobar"><div class="bar mp"><i style="width:${clamp(p.mp/p.maxmp*100,0,100)}%"></i></div><span class="nums">MP ${p.mp}/${p.maxmp}</span></div>`;

  // =====================================================================

  let activeMember = null, over = false;

  function lungeTarget(attacker, target) {
    const from = attacker.home, to = target.home;
    return from.add(to.subtract(from).scale(0.66)).add(new V3(0, attacker.baseY, 0).subtract(new V3(0, attacker.baseY, 0)));
  }

  async function dashAttack(attacker, target, onHit) {
    attacker._busy = true;
    const home = attacker.home.clone();
    const dest = home.add(target.home.subtract(home).scale(0.62));
    dest.y = attacker.baseY;
    await moveTo(attacker.node, dest, 260);
    await onHit();
    await moveTo(attacker.node, home, 320);
    attacker.node.position.copyFrom(home); attacker._busy = false;
  }
  async function swing(arm) { await rotTo(arm, 'x', 0, -2.3, 110); await rotTo(arm, 'x', -2.3, 0.6, 100); await rotTo(arm, 'x', 0.6, 0, 130); }

  function damageEnemy(e, dmg, color = '#ffffff') {
    e.hp = Math.max(0, e.hp - dmg);
    hitFlash(e.node, '#ff6060'); burst(worldOf(e.node, 0.6), ...FX.hit, 55, 6);
    floatDamage(e.node, String(dmg), color, 2.6);
    e._busy = true; const h = e.home.clone();
    moveTo(e.node, h.add(new V3(0.5, 0, 0)), 90).then(() => moveTo(e.node, h, 150).then(() => { e.node.position.copyFrom(h); e._busy = false; }));
    if (e.hp <= 0) killEnemy(e);
    renderEnemies(false);

  async function killEnemy(e) {

  function healMember(p, amt) {

  }

    clearMenu(m.name + ' · Magic');
    m.magic.forEach(s => {
      const label = s.name + (s.target === 'all' || s.target === 'allparty' ? '  (all)' : '');
      cmd(label, s.mp + ' MP', () => {
        if (s.target === 'enemy') chooseEnemy('Cast ' + s.name + ' on?', e => act(done, () => doSpell(m, s, [e])), () => showMagic(m, done));
        else if (s.target === 'ally') chooseAlly('Cast ' + s.name + ' on?', aliveParty(), p => act(done, () => doSpell(m, s, [p])), () => showMagic(m, done));
        else if (s.target === 'all') act(done, () => doSpell(m, s, aliveEnemies()));
        else if (s.target === 'allparty') act(done, () => doSpell(m, s, aliveParty()));
      }, m.mp < s.mp);
    });
    backBtn(() => showMain(m, done));
  }

  function showItems(m, done) {
    clearMenu(m.name + ' · Items');
    for (const [key, it] of Object.entries(inv)) {
      let disabled = it.qty <= 0;
      if (it.target === 'dead' && deadParty().length === 0) disabled = true;
      cmd(it.name, '×' + it.qty, () => {
        if (it.target === 'enemy') chooseEnemy('Throw ' + it.name + ' at?', e => act(done, () => doItem(m, key, it, [e])), () => showItems(m, done));
        else if (it.target === 'ally') chooseAlly('Use ' + it.name + ' on?', aliveParty(), p => act(done, () => doItem(m, key, it, [p])), () => showItems(m, done));
        else if (it.target === 'dead') chooseAlly('Revive whom?', deadParty(), p => act(done, () => doItem(m, key, it, [p])), () => showItems(m, done));
      }, disabled, 'qty');
    }
    backBtn(() => showMain(m, done));
  }

  function chooseEnemy(prompt, onPick, onBack) {
    clearMenu(prompt); msg(prompt);
    renderEnemies(true, e => { renderEnemies(false); onPick(e); });
    backBtn(() => { renderEnemies(false); onBack(); });
  }
  function chooseAlly(prompt, candidates, onPick, onBack) {
    clearMenu(prompt); msg(prompt);
    renderParty(true, candidates, p => { renderParty(false); onPick(p); });
    backBtn(() => { renderParty(false); onBack(); });
  }

  // wrap an action: lock UI, run it, resolve the member's turn
  async function act(done, fn) { lockMenu(); await fn(); refresh(); activeMember = null; renderParty(false); done(); }

  // ---- actual action implementations ----
  async function doFight(m, target) {
    msg(`${m.name} strikes ${target.name}!`);
    await dashAttack(m, target, async () => {
      if (m.arm) await swing(m.arm);
      let dmg = rnd(m.fight.min, m.fight.max);
      const crit = Math.random() < m.fight.crit;
      if (crit) dmg = Math.round(dmg * 1.8);
      if (m.fight.big) burst(worldOf(target.node, 0.4), ...FX.beam, 50, 7);
      damageEnemy(target, dmg, crit ? '#fcd34d' : '#ffffff');
      if (crit) msg('Critical hit! ' + dmg + ' damage!');
    });
  }
  async function doDefend(m) { msg(`${m.name} braces for impact.`); m._defend = true; await wait(350); }

  async function doSpell(m, s, targets) {
    m.mp -= s.mp; renderParty(false);
    if (s.heal) {
      msg(`${m.name} casts ${s.name}!`);
      if (m.staffPiv) await rotTo(m.staffPiv, 'z', 0, -0.5, 150).then(() => rotTo(m.staffPiv, 'z', -0.5, 0, 200));
      for (const p of targets) healMember(p, rnd(s.min, s.max));
      await wait(650); return;
    }
    if (s.proj || s.fx === 'beam') {
      msg(`${m.name} unleashes ${s.name}!`);
      if (m.arm && s.fx === 'beam') swing(m.arm);
      for (const e of targets) {
        const ball = MB.CreateSphere('p', { diameter: s.fx === 'beam' ? 0.6 : 0.4 }, scene);
        ball.material = M('pMat', s.fx === 'beam' ? '#c7d2fe' : '#1c1c1c', { emissive: s.fx === 'beam' ? '#6366f1' : '#000' });
        ball.position = worldOf(m.node, -0.2);
        await moveTo(ball, worldOf(e.node, -0.2), 320);
        ball.dispose(); burst(worldOf(e.node, 0.2), ...FX[s.fx], 80, 9);
        damageEnemy(e, rnd(s.min, s.max), s.fx === 'beam' ? '#a5b4fc' : '#ffd1d1');
      }
      await wait(400); return;
    }
    // direct elemental (broadside / brine bolt / cross-slash on all)
    msg(`${m.name} unleashes ${s.name}!`);
    for (const e of targets) { burst(worldOf(e.node, 0.4), ...FX[s.fx], 70, 8); hitFlash(e.node, FX[s.fx][0]); damageEnemy(e, rnd(s.min, s.max), s.fx === 'water' ? '#5eead4' : '#a5b4fc'); await wait(120); }
    await wait(380);
  }

  async function doItem(m, key, it, targets) {
    it.qty--;
    if (it.kind === 'heal') { msg(`${m.name} uses ${it.name}.`); healMember(targets[0], it.amount); await wait(600); }
    else if (it.kind === 'mana') { const p = targets[0]; p.mp = Math.min(p.maxmp, p.mp + it.amount); msg(`${m.name} uses ${it.name}. +${it.amount} MP!`); burst(worldOf(p.node, 0.2), ...FX.mana, 45, 5, -2); floatDamage(p.node, '+' + it.amount + ' MP', '#93c5fd', 2.6); renderParty(false); await wait(600); }
    else if (it.kind === 'revive') { const p = targets[0]; p.alive = true; p.node.setEnabled(true); p.node.position.copyFrom(p.home); p.node.rotation.x = 0; p.hp = Math.round(p.maxhp * 0.5); msg(`${p.name} is revived!`); burst(worldOf(p.node, 0.5), '#fff6c2', '#fde68a', 80, 6, -1); floatDamage(p.node, '+' + p.hp, '#fde68a', 2.6); renderParty(false); await wait(700); }
    else { msg(`${m.name} hurls a ${it.name}!`); const ball = MB.CreateSphere('b', { diameter: 0.4 }, scene); ball.material = M('bMat', '#222', { emissive: '#1a0a00' }); ball.position = worldOf(m.node, -0.2); await moveTo(ball, worldOf(targets[0].node, -0.2), 360); ball.dispose(); burst(worldOf(targets[0].node, 0.2), ...FX.fire, 100, 11); damageEnemy(targets[0], rnd(it.min, it.max), '#fca5a5'); await wait(500); }
  }

  // ---- enemy actions ----
  async function enemyAct(e) {
    if (!e.alive || over) return;
    const targetsAlive = aliveParty(); if (targetsAlive.length === 0) return;
    const move = e.moves[rnd(0, e.moves.length - 1)];
    const home = e.home.clone();
    e._busy = true;

    if (move.all) {
      msg(`${e.name} ${move.name}!`);
      // rear up
      await moveTo(e.node, home.add(new V3(-1.2, 0.4, 0)), 220);
      for (const p of targetsAlive) {
        let dmg = rnd(move.min, move.max); if (p._defend) dmg = Math.round(dmg * 0.5);
        applyToMember(p, dmg);
      }
      await wait(200);
      await moveTo(e.node, home, 320); e.node.position.copyFrom(home); e._busy = false;
    } else {
      const target = targetsAlive[rnd(0, targetsAlive.length - 1)];
      msg(`${e.name} ${move.name} at ${target.name}!`);
      const dest = home.add(target.home.subtract(home).scale(0.6)); dest.y = e.baseY;
      await moveTo(e.node, dest, 240);
      let dmg = rnd(move.min, move.max); if (target._defend) dmg = Math.round(dmg * 0.5);
      applyToMember(target, dmg);
      await wait(160);
      await moveTo(e.node, home, 340); e.node.position.copyFrom(home); e._busy = false;
    }
    await wait(220);
  }
  function applyToMember(p, dmg) {
    p.hp = Math.max(0, p.hp - dmg);
    hitFlash(p.node, '#ff5050'); burst(worldOf(p.node, 0.0), ...FX.hit, 50, 6); floatDamage(p.node, String(dmg), '#ff8a8a', 2.4);
    if (p.hp <= 0 && p.alive) koMember(p);
    renderParty(false);
  }
  async function koMember(p) {
    p.alive = false;
    tween(k => { p.node.rotation.x = k * 1.4; p.node.position.y = p.baseY - k * 0.4; }, 500);
  }

  // ---- round loop ----
  function checkEnd() {
    if (aliveEnemies().length === 0 && !over) { finish(true); return true; }
    if (aliveParty().length === 0 && !over) { finish(false); return true; }
    return false;
  }
  async function battleLoop() {
    while (!over) {
      for (const m of party) {
        if (over) break;
        if (!m.alive) continue;
        m._defend = false;
        await takeTurn(m);
        if (checkEnd()) return;
        await wait(250);
      }
      if (over) break;
      for (const e of enemies) {
        if (over) break;
        if (!e.alive) continue;
        await enemyAct(e);
        if (checkEnd()) return;
      }
    }
  }

  async function finish(won) {
    over = true; lockMenu(); activeMember = null; renderParty(false);
    if (won) { msg('The beach is safe once more!'); }
    else { msg('The party has fallen...'); }
    await wait(900);
    el('endTitle').textContent = won ? 'Victory!' : 'Wiped Out';
    el('endText').textContent = won
      ? 'The high seas retreat. Your party stands triumphant on the sand. 🏖️⚓'
      : 'The tide drags your heroes under. Regroup and try again?';
    el('end').classList.add('show');
  }

  // =====================================================================
  //  BOOT
  // =====================================================================
  refresh();
  el('introParty').textContent = party.map(p => p.name).join(' · ');
  el('introEnemies').textContent = enemies.map(e => e.name).join(' · ');
  engine.runRenderLoop(() => scene.render());
  window.addEventListener('resize', () => engine.resize());

  (async () => {
    await wait(3000);
    el('intro').style.display = 'none';
    msg('The battle begins!');
    battleLoop();
  })();
  </script>
</body>
