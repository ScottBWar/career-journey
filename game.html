<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Beach Brawl — A High-Seas RPG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: 'Space Grotesk', system-ui, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; }
    body { background: linear-gradient(180deg, #1b1145 0%, #5b2a86 35%, #c2557b 62%, #ef8f6e 100%); transition: background 0.6s ease; }
    body.mode-island { background: linear-gradient(180deg, #2a4a8a 0%, #4a86c8 40%, #9fd0e8 75%, #d8eef5 100%); }
    body.mode-sea    { background: linear-gradient(180deg, #1c4f8a 0%, #2f7ec0 45%, #8fc6e8 100%); }
    body.mode-town   { background: linear-gradient(180deg, #3a5a9a 0%, #6aa0d0 45%, #c9e2ee 100%); }
    body.mode-dungeon{ background: linear-gradient(180deg, #07060f 0%, #14122a 100%); }
    body.mode-battle { background: linear-gradient(180deg, #1b1145 0%, #5b2a86 32%, #c2557b 58%, #ef8f6e 82%, #ffd9a0 100%); }
    body.mode-shipbattle { background: linear-gradient(180deg, #20407a 0%, #3a6ea8 45%, #8fb8d8 100%); }
    #renderCanvas { position: fixed; inset: 0; width: 100%; height: 100%; outline: none; touch-action: none; z-index: 0; }

    .pill { font: inherit; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.85rem 2rem; border-radius: 999px; border: none; cursor: pointer; color: #05060f; background: linear-gradient(120deg, #a5b4fc, #f0abfc, #5eead4); box-shadow: 0 10px 30px rgba(165,180,252,0.4); text-decoration: none; display: inline-flex; align-items: center; gap: 0.4rem; }
    .pill.ghost { color: #fff; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.3); box-shadow: none; }
    .pill.small { padding: 0.5rem 1rem; font-size: 0.78rem; letter-spacing: 0.06em; }
    .pill:hover:not(:disabled) { transform: translateY(-2px); }
    .pill:disabled { opacity: 0.4; cursor: not-allowed; }

    .panel { background: linear-gradient(180deg, rgba(16,32,82,0.94), rgba(8,16,48,0.96)); border: 1px solid rgba(150,185,255,0.55); border-radius: 12px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), 0 0 0 1px rgba(20,40,90,0.8), 0 14px 44px rgba(0,0,0,0.55); }
    /* FF-style windows: crisp light-blue frame + inner highlight */
    .menu, .eplate, .pmember, .hud-m, #hudGold, .enemy-plate, #bActive, #shipMsg, #turnbar {
      border-color: rgba(150,185,255,0.5) !important;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.07), 0 8px 26px rgba(0,0,0,0.5) !important;
    }
    .menu .title, .sk-head h2, #shop h2, .sk-name, .date-name { color: #ffe6a6 !important; }
    .menu .cmd .cmd-label { font-size: 0.92rem; font-weight: 700; letter-spacing: 0.02em; }

    .back-link { position: fixed; top: 0.6rem; right: 0.8rem; z-index: 20; color: rgba(255,255,255,0.7); text-decoration: none; font-size: 0.78rem; }
    .back-link:hover { color: #fff; }

    /* ---------- START ---------- */
    #start { position: fixed; inset: 0; z-index: 30; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: rgba(5,4,18,0.6); backdrop-filter: blur(4px); }
    body.mode-start #start { display: flex; }
    #start h1 { font-size: clamp(2.6rem, 11vw, 6rem); font-weight: 700; background: linear-gradient(120deg, #a5b4fc, #f0abfc, #5eead4); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    #start p { margin-top: 0.6rem; color: rgba(255,255,255,0.8); letter-spacing: 0.05em; }
    #start .actions { margin-top: 2rem; display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }

    /* ---------- WORLD/TOWN HUD ---------- */
    #worldHUD { position: fixed; left: 0; right: 0; top: 0; z-index: 10; display: none; justify-content: space-between; align-items: flex-start; padding: 0.7rem 0.9rem; pointer-events: none; }
    body.mode-island #worldHUD, body.mode-sea #worldHUD, body.mode-town #worldHUD, body.mode-dungeon #worldHUD { display: flex; }
    #hudParty { display: flex; gap: 0.5rem; pointer-events: auto; }
    .hud-m { display: flex; gap: 0.45rem; align-items: center; background: rgba(8,16,48,0.82); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; padding: 0.4rem 0.55rem; min-width: 150px; }
    .hud-m.ko { opacity: 0.45; }
    .hud-port { width: 34px; height: 34px; flex: 0 0 auto; }
    .hud-info { flex: 1; min-width: 88px; }
    .hud-row { display: flex; justify-content: space-between; font-size: 0.72rem; font-weight: 700; gap: 0.5rem; }
    .hud-lv { color: #fcd34d; }
    .hud-bar { height: 6px; border-radius: 4px; background: rgba(0,0,0,0.45); overflow: hidden; margin-top: 0.25rem; }
    .hud-bar > i { display: block; height: 100%; }
    .hud-bar.php > i { background: linear-gradient(90deg, #34d399, #6ee7b7); }
    .hud-bar.mp > i { background: linear-gradient(90deg, #60a5fa, #93c5fd); }
    .hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.5rem; pointer-events: auto; }
    #hudGold { background: rgba(8,16,48,0.8); border: 1px solid rgba(255,255,255,0.2); border-radius: 9px; padding: 0.4rem 0.7rem; font-weight: 700; font-size: 0.85rem; color: #fde68a; }
    .hud-btns { display: flex; gap: 0.4rem; }
    .hud-btn { font: inherit; font-weight: 700; font-size: 0.8rem; padding: 0.45rem 0.8rem; border-radius: 9px; border: 1px solid rgba(255,255,255,0.25); background: rgba(8,16,48,0.8); color: #fff; cursor: pointer; }
    .hud-btn:hover { background: rgba(129,140,248,0.4); }

    #minimap { position: fixed; right: 10px; bottom: 10px; z-index: 11; display: none; border-radius: 50%; border: 2px solid rgba(150,185,255,0.5); background: rgba(8,16,48,0.55); box-shadow: 0 6px 20px rgba(0,0,0,0.5); width: 120px; height: 120px; }
    body.mode-island #minimap, body.mode-sea #minimap { display: block; }
    #worldPrompt { position: fixed; left: 50%; bottom: 8%; transform: translateX(-50%); z-index: 11; display: none; padding: 0.6rem 1.4rem; background: rgba(8,6,24,0.82); border: 1px solid rgba(252,211,77,0.6); border-radius: 999px; font-weight: 700; letter-spacing: 0.04em; cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,0.45); }
    #worldPrompt.show { display: block; }

    /* ---------- BATTLE UI ---------- */
    #battleUI { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; justify-content: space-between; padding: clamp(0.6rem,1.6vw,1.3rem); pointer-events: none; }
    body.mode-battle #battleUI { display: flex; }
    .enemies { display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap; pointer-events: auto; }
    .eplate { min-width: 160px; max-width: 240px; flex: 1 1 170px; background: linear-gradient(180deg, rgba(16,32,82,0.85), rgba(8,16,48,0.85)); border: 1px solid rgba(255,255,255,0.22); border-radius: 10px; padding: 0.5rem 0.7rem; box-shadow: 0 8px 24px rgba(0,0,0,0.45); transition: opacity 0.4s, transform 0.2s; }
    .eplate.dead { opacity: 0.3; }
    .eplate.targetable { cursor: pointer; }
    .eplate.targetable:hover { transform: translateY(-3px); border-color: #fcd34d; box-shadow: 0 8px 28px rgba(252,211,77,0.4); }
    .eplate .row { display: flex; justify-content: space-between; align-items: baseline; gap: 0.4rem; }
    .eplate .name { font-weight: 700; font-size: 0.84rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .eweak { margin-left: 0.3rem; font-size: 0.92em; animation: weakpulse 1.6s ease-in-out infinite; }
    @keyframes weakpulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
    .st-strip { margin-left: 0.35rem; display: inline-flex; gap: 0.12rem; vertical-align: middle; }
    .st-ic { font-size: 0.86em; font-weight: 700; line-height: 1; }
    .pouch-item { display: flex; flex-direction: column; gap: 0.4rem; }
    .pouch-acts { display: flex; gap: 0.4rem; }
    .pouch-acts .pill.small { flex: 1; }
    .eplate .hpnum { font-size: 0.7rem; color: rgba(255,255,255,0.65); }
    .bar { height: 9px; border-radius: 5px; background: rgba(0,0,0,0.45); overflow: hidden; margin-top: 0.35rem; border: 1px solid rgba(255,255,255,0.14); }
    .bar > i { display: block; height: 100%; transition: width 0.45s ease; }
    .bar.hp > i { background: linear-gradient(90deg, #f87171, #fca5a5); }
    .bar.php > i { background: linear-gradient(90deg, #34d399, #6ee7b7); }
    .bar.mp > i { background: linear-gradient(90deg, #60a5fa, #93c5fd); }
    .bottom { display: flex; gap: 0.8rem; align-items: flex-end; justify-content: space-between; }
    .party { pointer-events: auto; display: flex; flex-direction: column; gap: 0.4rem; min-width: 240px; max-width: 330px; flex: 1; }
    .pmember { background: linear-gradient(180deg, rgba(16,32,82,0.88), rgba(8,16,48,0.9)); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; padding: 0.45rem 0.7rem; box-shadow: 0 8px 24px rgba(0,0,0,0.45); transition: border-color 0.2s, transform 0.15s; }
    .pmember.active { border-color: #fcd34d; box-shadow: 0 0 0 1px #fcd34d, 0 8px 28px rgba(252,211,77,0.35); transform: translateX(6px); }
    .pmember.dead { opacity: 0.4; }
    .pmember.targetable { cursor: pointer; }
    .pmember.targetable:hover { border-color: #6ee7b7; }
    .pmember .row { display: flex; justify-content: space-between; align-items: baseline; }
    .pmember .name { font-weight: 700; font-size: 0.82rem; }
    .pmember .role { font-size: 0.62rem; color: rgba(255,255,255,0.5); letter-spacing: 0.1em; text-transform: uppercase; }
    .pmember .nums { font-size: 0.64rem; color: rgba(255,255,255,0.6); }
    .twobar { display: grid; grid-template-columns: 1fr auto; gap: 0.4rem; align-items: center; }
    .menu { pointer-events: auto; width: min(280px, 44vw); background: linear-gradient(180deg, rgba(16,32,82,0.92), rgba(8,16,48,0.94)); border: 1px solid rgba(255,255,255,0.26); border-radius: 12px; padding: 0.45rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .menu .title { font-size: 0.66rem; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.5); padding: 0.25rem 0.6rem 0.4rem; }
    .menu .cmd { display: flex; flex-direction: column; align-items: stretch; gap: 0.12rem; width: 100%; text-align: left; font: inherit; font-weight: 500; color: #fff; background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 0.45rem 0.7rem; cursor: pointer; transition: background 0.12s, transform 0.06s, border-color 0.12s; }
    .menu .cmd .cmd-row { display: flex; justify-content: space-between; align-items: center; }
    .menu .cmd .cmd-desc { font-size: 0.68rem; color: rgba(255,255,255,0.55); font-weight: 400; }
    .menu .cmd:hover:not(:disabled), .menu .cmd.kbfocus { background: rgba(129,140,248,0.3); border-color: rgba(165,180,252,0.6); }
    .menu .cmd:active:not(:disabled) { transform: scale(0.98); }
    .menu .cmd:disabled { opacity: 0.32; cursor: not-allowed; }
    .eplate.kbfocus, .pmember.kbfocus { outline: 2px solid #fcd34d; outline-offset: 1px; box-shadow: 0 0 18px rgba(252,211,77,0.6); }
    .pmember.active .pm-port { box-shadow: 0 0 0 2px #fcd34d, 0 0 14px rgba(252,211,77,0.7); transform: scale(1.08); }
    .menu .cmd .cost { font-size: 0.74rem; color: #93c5fd; }
    .menu .cmd .cost.qty { color: #fcd34d; }
    .menu .cmd.back { color: rgba(255,255,255,0.6); }
    #bMessage { position: fixed; left: 50%; bottom: 210px; transform: translateX(-50%); z-index: 11; pointer-events: none; padding: 0.5rem 1.3rem; background: rgba(8,6,24,0.78); border: 1px solid rgba(255,255,255,0.2); border-radius: 999px; font-size: clamp(0.8rem,2.2vw,1rem); max-width: 92vw; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.45); display: none; }
    body.mode-battle #bMessage { display: block; }

    .float { position: fixed; z-index: 14; pointer-events: none; font-weight: 700; font-size: 1.6rem; text-shadow: 0 2px 6px rgba(0,0,0,0.7); transform: translate(-50%,-50%); animation: floatUp 0.95s ease-out forwards; }
    @keyframes floatUp { 0%{opacity:0;transform:translate(-50%,-30%) scale(0.6);} 20%{opacity:1;transform:translate(-50%,-90%) scale(1.15);} 100%{opacity:0;transform:translate(-50%,-200%) scale(1);} }

    /* ---------- MODALS ---------- */
    .overlay { position: fixed; inset: 0; z-index: 25; display: none; align-items: center; justify-content: center; background: rgba(5,4,18,0.6); backdrop-filter: blur(4px); padding: 1rem; }
    .overlay.show { display: flex; }

    /* dialogue */
    #dialogue { z-index: 24; align-items: flex-end; justify-content: center; background: none; backdrop-filter: none; pointer-events: none; }
    #dialogue .box { pointer-events: auto; width: min(640px, 94vw); margin-bottom: 6vh; padding: 1rem 1.2rem; }
    #dlgName { font-weight: 700; color: #fcd34d; letter-spacing: 0.05em; margin-bottom: 0.4rem; }
    #dlgText { font-size: clamp(0.95rem,2.6vw,1.15rem); line-height: 1.5; min-height: 3.2em; }
    #dlgNext { margin-top: 0.8rem; float: right; }

    /* confirm */
    #confirm .box { width: min(420px, 92vw); padding: 1.4rem; text-align: center; }
    #confirmText { font-size: 1.05rem; line-height: 1.5; }
    #confirm .actions { margin-top: 1.4rem; display: flex; gap: 0.8rem; justify-content: center; }

    /* shop */
    #shop .box { width: min(560px, 94vw); max-height: 84vh; overflow: auto; padding: 1.2rem; }
    #shop .shead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    #shop h2 { font-size: 1.4rem; }
    #shopGold { color: #fde68a; font-weight: 700; }
    .shop-row { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 0.7rem 0.4rem; border-bottom: 1px solid rgba(255,255,255,0.12); }
    .shop-info { display: flex; flex-direction: column; }
    .shop-info span { font-size: 0.78rem; color: rgba(255,255,255,0.6); }
    .shop-head { font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: #fcd34d; margin: 1rem 0 0.2rem; }
    .craft-mats { display: flex; flex-wrap: wrap; gap: 0.35rem; padding: 0.3rem 0.2rem 0.5rem; }
    .craft-mat { font-size: 0.72rem; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); border-radius: 0.5rem; padding: 0.12rem 0.45rem; color: #e8eefc; }
    .craft-none { font-size: 0.74rem; color: rgba(255,255,255,0.5); font-style: italic; padding: 0.2rem; }
    .craft-cost { color: #a7f3d0; font-style: normal; letter-spacing: 0.04em; }
    /* pause / bestiary / legend */
    .pausebox { text-align: center; max-width: 420px; }
    .pause-title { color: #fcd34d; letter-spacing: 0.1em; margin: 0.2rem 0 1rem; }
    .pause-menu { display: flex; flex-direction: column; gap: 0.6rem; }
    .pause-menu .pill { width: 100%; }
    .pause-hint { font-size: 0.74rem; color: rgba(255,255,255,0.55); margin-top: 1rem; }
    .bestiary-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0.7rem; margin-top: 0.8rem; }
    .best-card { display: flex; gap: 0.6rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); border-radius: 0.7rem; padding: 0.6rem; }
    .best-card.unknown { opacity: 0.55; }
    .best-card .portrait { width: 56px; height: 56px; image-rendering: auto; border-radius: 0.4rem; flex-shrink: 0; }
    .best-card .best-port-q { width: 56px; height: 56px; display: grid; place-items: center; font-size: 2rem; background: rgba(0,0,0,0.3); border-radius: 0.4rem; flex-shrink: 0; }
    .best-info { font-size: 0.76rem; line-height: 1.35; }
    .best-info b { font-size: 0.86rem; color: #ffe9a8; }
    .best-aff { display: flex; flex-wrap: wrap; gap: 0.2rem; margin-top: 0.2rem; }
    .best-aff span { font-size: 0.68rem; padding: 0.05rem 0.35rem; border-radius: 0.4rem; background: rgba(255,255,255,0.1); }
    .legend-list { display: flex; flex-direction: column; gap: 0.55rem; margin-top: 0.8rem; }
    .legend-row { display: flex; align-items: center; gap: 0.7rem; font-size: 0.86rem; }
    .legend-dot { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 6px currentColor; }
    .scr-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    .scr-head h2 { margin: 0; color: #fcd34d; letter-spacing: 0.06em; }
    .scr-sub { font-size: 0.78rem; color: rgba(255,255,255,0.6); margin: 0.2rem 0 0; }
    /* observatory */
    .obs-panel { max-width: 880px; }
    .obs-body { display: flex; gap: 1rem; margin-top: 0.7rem; flex-wrap: wrap; align-items: flex-start; }
    #obsCanvas { background: #05060f; border-radius: 0.8rem; border: 1px solid rgba(255,255,255,0.12); max-width: 100%; height: auto; flex: 0 0 auto; }
    .obs-lore { flex: 1 1 220px; min-width: 200px; }
    .obs-lore h3 { margin: 0 0 0.3rem; }
    .obs-lore p { font-size: 0.86rem; line-height: 1.45; color: rgba(255,255,255,0.82); }
    .obs-elem { font-size: 0.78rem; color: #ffe9a8; margin-bottom: 0.4rem; }
    /* arcade */
    .arc-panel { max-width: 600px; text-align: center; }
    #arcCanvas { background: #1a1426; border-radius: 0.7rem; margin: 0.4rem auto; max-width: 100%; height: auto; display: block; }
    .arc-hud { font-size: 0.86rem; color: #ffe9a8; margin-top: 0.4rem; }
    .arc-hud span { font-weight: bold; color: #fff; }
    .arc-result { font-size: 1rem; line-height: 1.5; margin: 1rem 0; }
    .arc-buoys { display: flex; gap: 1rem; justify-content: center; margin: 1.4rem 0; }
    .arc-buoy { width: 84px; height: 84px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.2); background: var(--bc); filter: brightness(0.42); cursor: pointer; transition: filter 0.1s, transform 0.1s; }
    .arc-buoy.lit { filter: brightness(1.4); transform: scale(1.08); box-shadow: 0 0 24px var(--bc); }
    /* coliseum */
    .col-panel { max-width: 640px; }
    .col-mid { text-align: center; max-width: 520px; }
    .col-leagues { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 0.8rem; }
    .col-league { text-align: left; font: inherit; color: #fff; background: rgba(18,20,40,0.7); border: 1px solid rgba(255,255,255,0.16); border-radius: 12px; padding: 0.7rem 0.9rem; cursor: pointer; transition: border-color 0.15s, transform 0.1s, box-shadow 0.2s; }
    .col-league:not(.locked):hover { border-color: #caa030; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(202,160,48,0.35); }
    .col-league.locked { opacity: 0.5; cursor: not-allowed; }
    .col-lg-top { display: flex; justify-content: space-between; align-items: baseline; }
    .col-lg-top b { color: #ffe9a8; font-size: 1.02rem; }
    .col-clear { color: #6ee7b7; font-size: 0.74rem; }
    .col-lg-sub { font-size: 0.82rem; color: rgba(255,255,255,0.72); margin-top: 0.2rem; }
    .col-lg-waves { font-size: 0.76rem; color: #a7f3d0; margin-top: 0.3rem; }
    .col-lg-lock { font-size: 0.74rem; color: #c06a7a; margin-top: 0.3rem; }
    .col-acts { display: flex; gap: 0.6rem; justify-content: center; margin-top: 1rem; }
    .col-result { font-size: 1rem; line-height: 1.5; margin: 1rem 0; }
    /* cinematic cutscene */
    #cine { position: fixed; inset: 0; z-index: 40; display: none; }
    #cine.show { display: block; cursor: pointer; }
    .cine-bar { position: absolute; left: 0; right: 0; height: 11vh; background: #000; transform: scaleY(0); transition: transform 0.5s ease; z-index: 2; }
    .cine-top { top: 0; transform-origin: top; } .cine-bot { bottom: 0; transform-origin: bottom; }
    #cine.show .cine-bar { transform: scaleY(1); }
    .cine-vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 42%, rgba(0,0,0,0.6) 100%); z-index: 1; }
    .cine-cap { position: absolute; left: 6%; right: 6%; bottom: 13.5vh; display: flex; gap: 0.9rem; align-items: center; z-index: 3;
      background: linear-gradient(180deg, rgba(8,10,24,0.0), rgba(8,10,24,0.85)); border-left: 3px solid #fcd34d; border-radius: 0.6rem; padding: 0.85rem 1.1rem; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
    .cine-port { width: 64px; flex: 0 0 64px; }
    .cine-port img, .cine-port .portrait { width: 64px; height: 64px; image-rendering: auto; border-radius: 0.45rem; border: 1px solid rgba(255,255,255,0.2); }
    .cine-body { flex: 1; min-width: 0; }
    .cine-name { color: #fcd34d; font-weight: 700; letter-spacing: 0.07em; font-size: 0.9rem; margin-bottom: 0.22rem; text-transform: uppercase; }
    .cine-line { font-size: 1.05rem; line-height: 1.45; color: #f2f4ff; }

    .gi-tag { font-size: 0.72rem; color: #fcd34d; }

    .gi-desc { font-size: 0.72rem; color: rgba(255,255,255,0.68); margin-top: 0.2rem; }
    .slot-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }

    #bResultTitle { font-size: clamp(2rem,8vw,3.4rem); font-weight: 700; background: linear-gradient(120deg, #a5b4fc, #f0abfc, #5eead4); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    #bResultText { margin-top: 0.8rem; line-height: 1.6; color: rgba(255,255,255,0.85); }

    /* ending */

    #end .box { background: none; border: none; box-shadow: none; max-width: 600px; }
    #endTitle { font-size: clamp(2.4rem,10vw,5rem); font-weight: 700; background: linear-gradient(120deg, #a5b4fc, #f0abfc, #5eead4); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    #endText { margin-top: 0.8rem; color: rgba(255,255,255,0.85); line-height: 1.6; }
    #end .actions { margin-top: 2rem; display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }

    /* redesigned skill trees */
    #skills .sk-wrap { width: min(960px, 96vw); }
    #partyScr .sk-wrap { width: min(900px, 96vw); max-height: 90vh; overflow: auto; }
    /* skill CONSTELLATION — a starfield talent tree with branch-coloured paths */
    .sk-block { position: relative; background:
        radial-gradient(1px 1px at 18% 22%, rgba(255,255,255,0.7), transparent),
        radial-gradient(1px 1px at 62% 14%, rgba(180,210,255,0.6), transparent),
        radial-gradient(1px 1px at 82% 40%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1px 1px at 33% 64%, rgba(200,180,255,0.6), transparent),
        radial-gradient(1px 1px at 73% 78%, rgba(255,255,255,0.5), transparent),
        radial-gradient(ellipse at 50% 0%, rgba(70,40,120,0.35), transparent 60%),
        linear-gradient(180deg, rgba(12,14,34,0.94), rgba(6,7,20,0.96));
      border: 1px solid rgba(150,140,255,0.22); border-radius: 16px; padding: 1rem 1.1rem 1.2rem; margin-bottom: 1.1rem; box-shadow: inset 0 0 40px rgba(60,40,120,0.18), 0 8px 30px rgba(0,0,0,0.4); }
    .sk-bhead { display: flex; justify-content: space-between; align-items: center; }
    .sk-bhead .sk-name { font-size: 1.15rem; font-weight: 700; letter-spacing: 0.02em; text-shadow: 0 0 12px rgba(140,170,255,0.5); }
    .sk-sp { font-size: 0.8rem; color: rgba(255,255,255,0.7); background: rgba(252,211,77,0.1); border: 1px solid rgba(252,211,77,0.4); padding: 0.25rem 0.7rem; border-radius: 999px; }
    .sk-sp b { color: #fcd34d; text-shadow: 0 0 8px rgba(252,211,77,0.7); }
    .sk-bstats { font-size: 0.72rem; color: rgba(190,205,245,0.72); margin: 0.4rem 0 0.6rem; letter-spacing: 0.02em; }
    .sk-tree { position: relative; width: 100%; }
    .sk-svg { position: absolute; inset: 0; width: 100%; }
    .sk-line { stroke: rgba(170,190,255,0.16); stroke-width: 3; stroke-linecap: round; }
    .sk-line.on { stroke: #8fb0ff; stroke-width: 4.5; filter: drop-shadow(0 0 5px rgba(140,170,255,0.9)); stroke-dasharray: 7 6; animation: skflow 1.2s linear infinite; }
    @keyframes skflow { to { stroke-dashoffset: -26; } }
    .sk-line.br-a.on { stroke: #ffd24a; filter: drop-shadow(0 0 6px rgba(255,210,74,0.95)); }
    .sk-line.br-b.on { stroke: #c08aff; filter: drop-shadow(0 0 6px rgba(192,138,255,0.95)); }
    .sk-n { position: absolute; transform: translate(-50%, -50%); width: 168px; display: flex; flex-direction: column; align-items: center; gap: 0.14rem; padding: 0.6rem 0.5rem 0.55rem; border-radius: 13px; font: inherit; color: #fff; cursor: pointer;
      border: 1px solid rgba(140,170,255,0.4); background: linear-gradient(180deg, rgba(26,34,72,0.97), rgba(12,16,40,0.98));
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 4px 14px rgba(0,0,0,0.45); transition: transform 0.12s, box-shadow 0.25s, border-color 0.25s; z-index: 2; }
    .sk-n::before { content: ''; position: absolute; top: -7px; width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle, #cfe0ff, #6a80c0); box-shadow: 0 0 8px rgba(160,190,255,0.7); } /* the "star" node bead */
    .sk-n-desc { font-size: 0.64rem; color: rgba(206,220,255,0.78); text-align: center; line-height: 1.24; }
    .sk-n:hover:not(:disabled) { transform: translate(-50%,-50%) scale(1.07); border-color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 6px 22px rgba(80,110,220,0.5); }
    .sk-n:disabled { cursor: default; }
    .sk-n-ic { font-size: 1.25rem; line-height: 1; filter: drop-shadow(0 0 6px currentColor); }
    .sk-n.ability .sk-n-ic { color: #f0abfc; }
    .sk-n.stat .sk-n-ic { color: #93c5fd; }
    .sk-n-name { font-weight: 700; font-size: 0.8rem; text-align: center; letter-spacing: 0.01em; }
    .sk-n-sub { font-size: 0.66rem; color: #fcd34d; font-weight: 700; }
    /* branch identity: a coloured left-edge + bead so the two paths read at a glance */
    .sk-n.br-a { border-left: 3px solid #ffd24a; } .sk-n.br-a::before { background: radial-gradient(circle, #fff0c0, #caa030); box-shadow: 0 0 8px rgba(255,210,74,0.8); }
    .sk-n.br-b { border-left: 3px solid #c08aff; } .sk-n.br-b::before { background: radial-gradient(circle, #e8d0ff, #8a5ad0); box-shadow: 0 0 8px rgba(192,138,255,0.8); }
    .sk-n.learned { border-color: #6ee7b7; background: linear-gradient(180deg, rgba(52,211,153,0.28), rgba(20,80,64,0.5)); box-shadow: 0 0 18px rgba(52,211,153,0.5), inset 0 0 12px rgba(110,231,183,0.2); }
    .sk-n.learned::before { background: radial-gradient(circle, #d6fff0, #34d399); box-shadow: 0 0 12px rgba(52,211,153,0.95); }
    .sk-n.learned .sk-n-sub { color: #6ee7b7; }
    .sk-n.avail { border-color: #fcd34d; box-shadow: 0 0 0 1px #fcd34d, 0 0 22px rgba(252,211,77,0.55); animation: skpulse 1.5s ease-in-out infinite; }
    .sk-n.avail::before { background: radial-gradient(circle, #fff3c0, #fcd34d); box-shadow: 0 0 14px rgba(252,211,77,1); animation: skpulse 1.5s ease-in-out infinite; }
    @keyframes skpulse { 0%,100%{ box-shadow: 0 0 0 1px #fcd34d, 0 0 12px rgba(252,211,77,0.4); } 50%{ box-shadow: 0 0 0 1px #fcd34d, 0 0 26px rgba(252,211,77,0.8); } }
    .sk-n.locked { opacity: 0.45; }
    .sk-n.pathlocked { opacity: 0.4; border-color: #6b3a4a; filter: grayscale(0.6); }
    .sk-n.pathlocked .sk-n-sub { color: #c06a7a; }

    /* party roster cards */
    .roster-card { text-align: left; font: inherit; color: #fff; background: rgba(18,20,40,0.7); border: 1px solid rgba(255,255,255,0.16); border-radius: 12px; padding: 0.8rem; cursor: pointer; transition: border-color 0.15s, transform 0.1s, box-shadow 0.2s; }

    .rc-role { font-size: 0.72rem; color: rgba(255,255,255,0.6); margin: 0.2rem 0 0.4rem; }
    .rc-weap { font-size: 0.74rem; color: #93c5fd; margin-top: 0.3rem; }

    /* endgame ally picker — tall "champion" cards with a full portrait */
    .ally-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.9rem; margin: 1rem 0; }
    .ally-card { position: relative; text-align: center; font: inherit; color: #fff; background: linear-gradient(180deg, rgba(30,34,64,0.9), rgba(12,14,30,0.9)); border: 2px solid rgba(255,255,255,0.16); border-radius: 14px; padding: 0.8rem 0.6rem 0.9rem; cursor: pointer; transition: border-color 0.15s, transform 0.1s, box-shadow 0.2s; }
    .ally-card:hover { transform: translateY(-3px); }
    .ally-card.on { border-color: #fcd34d; box-shadow: 0 0 0 2px #fcd34d, 0 10px 30px rgba(252,211,77,0.35); }

    .ally-port { width: 100%; aspect-ratio: 3/4; border-radius: 10px; overflow: hidden; background: radial-gradient(circle at 50% 35%, rgba(255,255,255,0.12), rgba(0,0,0,0.3)); display: flex; align-items: center; justify-content: center; margin-bottom: 0.5rem; }
    .ally-port canvas, .ally-port img { width: 100%; height: 100%; object-fit: cover; image-rendering: auto; }

    .ally-pick-num { position: absolute; top: 6px; right: 8px; width: 26px; height: 26px; border-radius: 50%; background: #fcd34d; color: #1a1206; font-weight: 800; font-size: 0.9rem; line-height: 26px; }
    .ally-badge { position: absolute; top: 6px; left: 8px; font-size: 0.6rem; letter-spacing: 0.08em; background: rgba(110,231,183,0.9); color: #06281c; padding: 2px 6px; border-radius: 6px; font-weight: 700; }

    /* portraits */
    .portrait { image-rendering: auto; width: 38px; height: 38px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.25); display: block; }
    .pm-head { display: flex; gap: 0.5rem; align-items: center; }

    .bar.lim { height: 5px; }
    .bar.lim > i { background: linear-gradient(90deg, #fcd34d, #fde047); }
    .eplate.boss { display: flex; gap: 0.5rem; align-items: center; }

    .eportrait img { width: 46px; height: 46px; }

    /* dialogue portrait */

    /* ship battle */
    #shipUI { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; justify-content: space-between; padding: clamp(0.6rem,1.6vw,1.3rem); pointer-events: none; }
    body.mode-shipbattle #shipUI { display: flex; }
    #shipUI .topbar { display: flex; justify-content: center; }
    #shipMsg { position: fixed; left: 50%; bottom: 210px; transform: translateX(-50%); z-index: 11; pointer-events: none; padding: 0.5rem 1.3rem; background: rgba(8,6,24,0.78); border: 1px solid rgba(255,255,255,0.2); border-radius: 999px; font-size: clamp(0.8rem,2.2vw,1rem); max-width: 92vw; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.45); display: none; }
    body.mode-shipbattle #shipMsg { display: block; }

    /* shipyard */
    #shipyard .sk-wrap { width: min(640px, 96vw); max-height: 90vh; overflow: auto; }
    .ship-preview { display: flex; gap: 1rem; align-items: center; background: rgba(8,16,48,0.5); border: 1px solid rgba(255,255,255,0.14); border-radius: 12px; padding: 0.9rem; margin-bottom: 1rem; }
    .ship-art { position: relative; width: 96px; height: 76px; flex: 0 0 auto; }

    .ship-sail { position: absolute; bottom: 26px; left: 40px; width: 16px; height: 40px; border-radius: 3px; }
    .ship-flag { position: absolute; top: -4px; left: 44px; font-size: 1.2rem; }

    /* shell hunt */
    .sh-panel { width: min(560px, 96vw); padding: 1.2rem; }

    .sh-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
    .sh-cell { aspect-ratio: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
    .sh-shell { font: inherit; font-size: 1.9rem; background: none; border: none; cursor: pointer; line-height: 1; animation: shellpop 0.14s ease; }
    .sh-shell.caught { animation: shellcatch 0.14s ease forwards; }
    @keyframes shellpop { from { transform: scale(0); } to { transform: scale(1); } }

    /* dating sim — the mermaid now floats as a live 3D scene; the overlay is transparent
       so she shows through, with only the themed particle ::after as light ambiance */
    #date.show[class*="scene-"] { backdrop-filter: none; background: transparent !important; }
    #date[class*="scene-"]::after { content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none; opacity: 0.5; }

    .date-char img { width: clamp(150px, 30vh, 260px); height: clamp(150px, 30vh, 260px); image-rendering: auto; border-radius: 14px; border: 2px solid rgba(255,255,255,0.25); box-shadow: 0 16px 40px rgba(0,0,0,0.6); }

    .date-opt .portrait.mini, .portrait.mini { width: 22px; height: 22px; display: inline-block; vertical-align: middle; border-radius: 4px; margin-right: 0.3rem; }

    /* fire — molten grotto with flickering embers */
    #date.scene-fire { background: radial-gradient(circle at 50% 125%, #ff8a3a 0%, #a82a1f 42%, #2a0a08 100%); }
    #date.scene-fire::after { background: radial-gradient(circle at 28% 82%, rgba(255,190,90,0.4), transparent 38%), radial-gradient(circle at 72% 92%, rgba(255,110,40,0.34), transparent 44%); animation: dsFlicker 2.3s ease-in-out infinite; }
    @keyframes dsFlicker { 0%,100% { opacity: 0.65; } 45% { opacity: 1; } 60% { opacity: 0.8; } }

    /* water — sunlit deep with drifting caustics */
    #date.scene-water { background: linear-gradient(180deg, #2a8fb0 0%, #0e3a4a 65%, #06212c 100%); }
    #date.scene-water::after { background: repeating-linear-gradient(115deg, rgba(255,255,255,0.07) 0 2px, transparent 2px 24px), repeating-linear-gradient(65deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 30px); animation: dsCaustic 7s linear infinite; }
    @keyframes dsCaustic { from { background-position: 0 0, 0 0; } to { background-position: 260px 70px, -200px 60px; } }

    /* thunder — storm sky with lightning flashes */
    #date.scene-thunder { background: linear-gradient(180deg, #313652 0%, #14172a 100%); }
    #date.scene-thunder::after { background: linear-gradient(120deg, transparent 40%, rgba(255,255,200,0.9) 50%, transparent 60%); opacity: 0; animation: dsBolt 5.5s linear infinite; }
    @keyframes dsBolt { 0%,90%,100% { opacity: 0; } 91% { opacity: 0.55; } 92% { opacity: 0; } 94% { opacity: 0.4; } 95% { opacity: 0; } }

    /* earth — verdant glade with drifting light */
    #date.scene-earth { background: radial-gradient(circle at 50% 28%, #5aa05a 0%, #2f5e30 55%, #15301a 100%); }
    #date.scene-earth::after { background: radial-gradient(circle at 22% 22%, rgba(190,235,160,0.22), transparent 32%), radial-gradient(circle at 78% 62%, rgba(150,210,130,0.18), transparent 36%); animation: dsDrift 9s ease-in-out infinite alternate; }
    @keyframes dsDrift { from { transform: translateY(6px); } to { transform: translateY(-10px); } }

    /* dark — abyssal shimmer */
    #date.scene-dark { background: radial-gradient(circle at 50% 42%, #43236a 0%, #1c1030 55%, #07050f 100%); }
    #date.scene-dark::after { background: radial-gradient(circle at 40% 60%, rgba(176,106,255,0.22), transparent 42%), radial-gradient(circle at 65% 35%, rgba(120,60,200,0.16), transparent 40%); animation: dsShimmer 7s ease-in-out infinite; }
    @keyframes dsShimmer { 0%,100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 0.95; transform: scale(1.08); } }

    /* holy — radiant rotating light rays */
    #date.scene-holy { background: radial-gradient(circle at 50% 32%, #fff4cc 0%, #e0b766 42%, #7a5a24 100%); }
    #date.scene-holy::after { background: conic-gradient(from 0deg at 50% 38%, transparent 0deg, rgba(255,255,255,0.22) 14deg, transparent 30deg, rgba(255,255,255,0.18) 56deg, transparent 74deg, rgba(255,255,255,0.22) 100deg, transparent 120deg, rgba(255,255,255,0.18) 150deg, transparent 170deg, rgba(255,255,255,0.22) 200deg, transparent 220deg, rgba(255,255,255,0.18) 250deg, transparent 270deg, rgba(255,255,255,0.22) 300deg, transparent 320deg, rgba(255,255,255,0.18) 348deg, transparent 360deg); animation: dsRays 26s linear infinite; transform-origin: 50% 38%; }
    @keyframes dsRays { to { transform: rotate(360deg); } }

    /* active-turn banner */
    #bActive { position: fixed; left: 0.9rem; bottom: 252px; z-index: 11; display: none; align-items: center; gap: 0.5rem; padding: 0.3rem 0.9rem 0.3rem 0.3rem; background: rgba(8,6,24,0.82); border: 1px solid #fcd34d; border-radius: 999px; box-shadow: 0 6px 20px rgba(0,0,0,0.5); }
    body.mode-battle #bActive.show { display: flex; }
    .ba-port { width: 42px; height: 42px; }
    .ba-meta { display: flex; flex-direction: column; line-height: 1.1; }
    .ba-name { font-weight: 700; font-size: 0.88rem; }
    .ba-turn { font-size: 0.6rem; color: #fcd34d; letter-spacing: 0.12em; text-transform: uppercase; }

    /* FF10-style turn-order bar */
    #turnbar { position: fixed; top: 64px; right: 8px; z-index: 11; display: none; flex-direction: column; align-items: center; gap: 5px; padding: 6px; background: rgba(8,6,24,0.55); border: 1px solid rgba(255,255,255,0.16); border-radius: 12px; }
    body.mode-battle #turnbar { display: flex; }
    .tb-label { font-size: 0.55rem; letter-spacing: 0.18em; color: rgba(255,255,255,0.6); }
    .tb-item { width: 36px; height: 36px; border-radius: 7px; overflow: hidden; border: 1px solid rgba(255,255,255,0.22); opacity: 0.72; transition: transform 0.2s, opacity 0.2s; }
    .tb-item.cur { opacity: 1; border-color: #fcd34d; box-shadow: 0 0 12px rgba(252,211,77,0.7); transform: scale(1.2); }
    .tb-item.enemy { border-color: rgba(255,120,120,0.45); }
    .tb-port { width: 100%; height: 100%; border-radius: 0; border: none; display: block; }
    .tb-chip { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; font-weight: 700; color: #0a0a18; }
    .float.big { font-size: 2.7rem; font-weight: 800; text-shadow: 0 0 12px currentColor, 0 2px 8px rgba(0,0,0,0.8); animation: floatBig 1.05s cubic-bezier(.2,1.4,.4,1) forwards; }
    @keyframes floatBig { 0%{opacity:0;transform:translate(-50%,-20%) scale(0.3) rotate(-8deg);} 16%{opacity:1;transform:translate(-50%,-95%) scale(1.5) rotate(3deg);} 30%{transform:translate(-50%,-100%) scale(1.15) rotate(0);} 100%{opacity:0;transform:translate(-50%,-210%) scale(1.1);} }

    /* start-screen party portraits */
    #startPortraits { display: flex; gap: 0.5rem; justify-content: center; margin-top: 1.4rem; flex-wrap: wrap; }
    #startPortraits .start-port { width: 56px; height: 56px; box-shadow: 0 6px 18px rgba(0,0,0,0.5); }

    /* limit-break banner */
    #limitBanner { position: fixed; left: 50%; top: 32%; transform: translate(-50%,-50%); z-index: 38; display: none; flex-direction: column; align-items: center; text-align: center; pointer-events: none; }
    #limitBanner.show { display: flex; animation: lbSlam 1.7s ease forwards; }
    .lb-tag { font-size: 0.85rem; letter-spacing: 0.32em; color: #fde047; font-weight: 700; }
    .lb-name { font-size: clamp(2.2rem, 8vw, 4.5rem); font-weight: 700; background: linear-gradient(120deg, #fff, #fde047, #ff9e3a); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 4px 22px rgba(253,224,71,0.65)); }
    @keyframes lbSlam { 0% { opacity: 0; transform: translate(-50%,-50%) scale(2.3); } 12% { opacity: 1; transform: translate(-50%,-50%) scale(1); } 82% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-50%) scale(1.1); } }

    /* intro crawl */
    #introSeq { position: fixed; inset: 0; z-index: 35; display: none; overflow: hidden; background: radial-gradient(circle at 50% 28%, #0c1238 0%, #03040c 72%); }
    #introSeq.show { display: block; }
    #introSeq::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(1px 1px at 20% 30%, #fff, transparent), radial-gradient(1px 1px at 70% 60%, #cdd, transparent), radial-gradient(1px 1px at 40% 80%, #fff, transparent), radial-gradient(1px 1px at 85% 25%, #bcd, transparent), radial-gradient(1px 1px at 55% 45%, #fff, transparent); background-size: 220px 220px; opacity: 0.5; animation: introStars 6s linear infinite; }
    @keyframes introStars { to { transform: translateY(-220px); } }
    #introCrawl { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); width: min(680px, 90vw); text-align: center; animation: introCrawl 22s linear forwards; }
    @keyframes introCrawl { from { top: 100%; } to { top: -170%; } }
    .ic-title { font-size: clamp(2.6rem, 9vw, 5.5rem); font-weight: 700; letter-spacing: 0.08em; background: linear-gradient(120deg, #a5b4fc, #f0abfc, #5eead4); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.2rem; filter: drop-shadow(0 6px 30px rgba(165,180,252,0.5)); }
    .ic-sub { letter-spacing: 0.42em; color: #fcd34d; font-size: 0.95rem; margin-bottom: 2.4rem; }
    .ic-body p { font-size: clamp(1rem, 2.7vw, 1.45rem); line-height: 1.75; color: #dbe4ff; margin-bottom: 1.5rem; }
    .ic-body p:first-child { color: #fde047; letter-spacing: 0.22em; font-weight: 700; }
    #introBegin { position: fixed; bottom: 1.4rem; right: 1.4rem; z-index: 36; }

    /* battle transition */
    #transition { position: fixed; inset: 0; z-index: 40; pointer-events: none; opacity: 0; }
    #transition.show { animation: battleWipe 0.8s ease forwards; }
    @keyframes battleWipe {
      0% { opacity: 0; clip-path: circle(0% at 50% 50%); background: #0a0a18; }
      22% { opacity: 1; clip-path: circle(170% at 50% 50%); background: #0a0a18; }
      44% { opacity: 1; background: #ffffff; }
      60% { opacity: 1; background: #ffffff; }
      100% { opacity: 0; background: #ffffff; }
    }

    @media (max-width: 680px) {
      #bMessage { bottom: 188px; }
      .hud-m { min-width: 78px; }
      .hud-btn { padding: 0.4rem 0.55rem; font-size: 0.72rem; }
      #start h1 { font-size: 3rem; }
      .sk-n { width: 116px; }
    }
  </style>
</head>
<body class="mode-start">
  <canvas id="renderCanvas"></canvas>
  <a class="back-link" href="coming-soon.html">← Site</a>

  <!-- WORLD / TOWN HUD -->
  <div id="worldHUD">
    <div id="hudParty"></div>
    <div class="hud-right">
      <div id="hudGold">⛃ 0</div>
      <div class="hud-btns">

        <button class="hud-btn" id="btnSkills">Skills (M)</button>
        <button class="hud-btn" id="btnGear">Gear (G)</button>
        <button class="hud-btn" id="btnFx" title="Graphics quality">✨</button>
        <button class="hud-btn" id="btnMusic">🔊</button>
        <button class="hud-btn" id="btnPause" title="Pause / Menu (Esc)">☰</button>
      </div>
    </div>
  </div>
  <div id="worldPrompt"></div>
  <canvas id="minimap" width="150" height="150"></canvas>

  <!-- BATTLE -->
  <div id="battleUI">
    <div class="enemies" id="bEnemies"></div>
    <div class="bottom">
      <div class="party" id="bParty"></div>
      <div class="menu" id="bMenu"></div>
    </div>
  </div>
  <div id="bMessage"></div>
  <div id="bActive"></div>
  <div id="turnbar"></div>
  <div id="limitBanner"></div>

  <!-- 90s-style intro crawl -->
  <div id="introSeq">
    <div id="introCrawl"></div>
    <button class="pill small" id="introBegin">▶ Begin</button>
  </div>
  <div class="overlay" id="bResult"><div class="box panel"><h1 id="bResultTitle">Victory!</h1><p id="bResultText"></p><button class="pill" id="bResultBtn">Continue</button></div></div>

  <!-- START -->
  <div id="start">
    <h1>Beach Brawl</h1>
    <p>A high-seas RPG · explore, battle, level up, romance mermaids, and turn the tide</p>
    <div id="startPortraits"></div>
    <div class="actions">
      <button class="pill" id="startNew">New Game</button>
      <button class="pill ghost" id="startContinue">Continue</button>
    </div>
  </div>

  <!-- DIALOGUE -->
  <div class="overlay" id="dialogue"><div class="box panel"><div class="dlg-row"><div class="dlg-port" id="dlgPortrait"></div><div class="dlg-body"><div id="dlgName"></div><div id="dlgText"></div></div></div><button class="pill small" id="dlgNext">Next ▶</button></div></div>

  <!-- SHIP BATTLE -->
  <div id="shipUI">
    <div class="topbar"><div class="eplate boss" style="max-width:360px"><div class="row"><span class="name" id="shipEName"></span><span class="hpnum" id="shipEHPn"></span></div><div class="bar hp"><i id="shipEHP"></i></div></div></div>
    <div class="bottom">
      <div class="party"><div class="pmember"><div class="row"><span class="name">⛵ Your Ship</span></div><div class="twobar"><div class="bar php"><i id="shipMHP"></i></div><span class="nums" id="shipMHPn"></span></div></div></div>
      <div class="menu" id="shipMenu"></div>
    </div>
  </div>
  <div id="shipMsg"></div>
  <div class="overlay" id="shipResult"><div class="box panel"><h1 id="shipResultTitle"></h1><p id="shipResultText"></p><button class="pill" id="shipResultBtn">Continue</button></div></div>

  <!-- SHIPYARD + SHELL HUNT + DATING -->
  <div class="overlay" id="shipyard"><div class="panel" id="shipyardBody" style="padding:1.2rem;"></div></div>
  <div class="overlay" id="shellHunt"></div>
  <div class="overlay" id="date"></div>

  <!-- battle transition -->
  <div id="transition"></div>

  <!-- CONFIRM -->
  <div class="overlay" id="confirm"><div class="box panel"><div id="confirmText"></div><div class="actions"><button class="pill" id="confirmYes">Yes</button><button class="pill ghost" id="confirmNo">No</button></div></div></div>

  <!-- SHOP -->
  <div class="overlay" id="shop"><div class="box panel"><div class="shead"><h2>🛒 Shop</h2><span id="shopGold">⛃ 0</span><button class="pill ghost small" id="shopClose">Close</button></div><div id="shopList"></div></div></div>

  <!-- SKILLS -->
  <div class="overlay" id="skills"><div class="panel" id="skillBody" style="padding:1.2rem;"></div></div>

  <!-- GEAR / SEASHELLS -->
  <div class="overlay" id="gear"><div class="panel" id="gearBody" style="padding:1.2rem;"></div></div>

  <!-- PARTY -->
  <div class="overlay" id="partyScr"><div class="panel" id="partyBody" style="padding:1.2rem;"></div></div>

  <!-- ENDGAME ALLY PICKER (Ruffy's strike team for the two-party finale) -->
  <div class="overlay" id="allyPick"><div class="panel" id="allyPickBody" style="padding:1.2rem; max-width: 880px;"></div></div>

  <!-- PAUSE -->

  </div></div>

  <!-- BESTIARY -->
  <div class="overlay" id="bestiary"><div class="panel" id="bestiaryBody" style="padding:1.2rem;"></div></div>

  <!-- MAP LEGEND -->
  <div class="overlay" id="legend"><div class="panel" id="legendBody" style="padding:1.2rem;"></div></div>

  <!-- OBSERVATORY -->
  <div class="overlay" id="observatory"></div>

  <!-- ARCADE -->
  <div class="overlay" id="arcade"></div>

  <!-- COLISEUM -->
  <div class="overlay" id="coliseum"></div>

  <!-- CINEMATIC CUTSCENE -->
  <div id="cine">

    <div class="cine-bar cine-bot"></div>
