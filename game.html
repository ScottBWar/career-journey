<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Beach Brawl — A High-Seas RPG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: 'Space Grotesk', system-ui, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; }
    body { background: linear-gradient(180deg, #1b1145 0%, #5b2a86 35%, #c2557b 62%, #ef8f6e 100%); transition: background 0.6s ease; }
    body.mode-island { background: linear-gradient(180deg, #2a4a8a 0%, #4a86c8 40%, #9fd0e8 75%, #d8eef5 100%); }
    body.mode-sea    { background: linear-gradient(180deg, #1c4f8a 0%, #2f7ec0 45%, #8fc6e8 100%); }
    body.mode-town   { background: linear-gradient(180deg, #3a5a9a 0%, #6aa0d0 45%, #c9e2ee 100%); }
    body.mode-dungeon{ background: linear-gradient(180deg, #07060f 0%, #14122a 100%); }
    body.mode-battle { background: linear-gradient(180deg, #1b1145 0%, #5b2a86 32%, #c2557b 58%, #ef8f6e 82%, #ffd9a0 100%); }
    body.mode-shipbattle { background: linear-gradient(180deg, #20407a 0%, #3a6ea8 45%, #8fb8d8 100%); }
    #renderCanvas { position: fixed; inset: 0; width: 100%; height: 100%; outline: none; touch-action: none; z-index: 0; }

    .pill { font: inherit; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.85rem 2rem; border-radius: 999px; border: none; cursor: pointer; color: #05060f; background: linear-gradient(120deg, #a5b4fc, #f0abfc, #5eead4); box-shadow: 0 10px 30px rgba(165,180,252,0.4); text-decoration: none; display: inline-flex; align-items: center; gap: 0.4rem; }
    .pill.ghost { color: #fff; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.3); box-shadow: none; }
    .pill.small { padding: 0.5rem 1rem; font-size: 0.78rem; letter-spacing: 0.06em; }
    .pill:hover:not(:disabled) { transform: translateY(-2px); }
    .pill:disabled { opacity: 0.4; cursor: not-allowed; }

    .panel { background: linear-gradient(180deg, rgba(20,16,60,0.92), rgba(12,10,36,0.94)); border: 1px solid rgba(255,255,255,0.26); border-radius: 14px; box-shadow: 0 14px 40px rgba(0,0,0,0.5); }

    .back-link { position: fixed; top: 0.6rem; right: 0.8rem; z-index: 20; color: rgba(255,255,255,0.7); text-decoration: none; font-size: 0.78rem; }
    .back-link:hover { color: #fff; }

    /* ---------- START ---------- */
    #start { position: fixed; inset: 0; z-index: 30; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: rgba(5,4,18,0.6); backdrop-filter: blur(4px); }
    body.mode-start #start { display: flex; }
    #start h1 { font-size: clamp(2.6rem, 11vw, 6rem); font-weight: 700; background: linear-gradient(120deg, #a5b4fc, #f0abfc, #5eead4); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    #start p { margin-top: 0.6rem; color: rgba(255,255,255,0.8); letter-spacing: 0.05em; }
    #start .actions { margin-top: 2rem; display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }

    /* ---------- WORLD/TOWN HUD ---------- */
    #worldHUD { position: fixed; left: 0; right: 0; top: 0; z-index: 10; display: none; justify-content: space-between; align-items: flex-start; padding: 0.7rem 0.9rem; pointer-events: none; }
    body.mode-island #worldHUD, body.mode-sea #worldHUD, body.mode-town #worldHUD, body.mode-dungeon #worldHUD { display: flex; }
    #hudParty { display: flex; gap: 0.5rem; pointer-events: auto; }
    .hud-m { background: rgba(12,10,36,0.8); border: 1px solid rgba(255,255,255,0.2); border-radius: 9px; padding: 0.4rem 0.6rem; min-width: 120px; }
    .hud-m.ko { opacity: 0.45; }
    .hud-row { display: flex; justify-content: space-between; font-size: 0.72rem; font-weight: 700; gap: 0.5rem; }
    .hud-lv { color: #fcd34d; }
    .hud-bar { height: 6px; border-radius: 4px; background: rgba(0,0,0,0.45); overflow: hidden; margin-top: 0.25rem; }
    .hud-bar > i { display: block; height: 100%; }
    .hud-bar.php > i { background: linear-gradient(90deg, #34d399, #6ee7b7); }
    .hud-bar.mp > i { background: linear-gradient(90deg, #60a5fa, #93c5fd); }
    .hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.5rem; pointer-events: auto; }
    #hudGold { background: rgba(12,10,36,0.8); border: 1px solid rgba(255,255,255,0.2); border-radius: 9px; padding: 0.4rem 0.7rem; font-weight: 700; font-size: 0.85rem; color: #fde68a; }
    .hud-btns { display: flex; gap: 0.4rem; }
    .hud-btn { font: inherit; font-weight: 700; font-size: 0.8rem; padding: 0.45rem 0.8rem; border-radius: 9px; border: 1px solid rgba(255,255,255,0.25); background: rgba(12,10,36,0.8); color: #fff; cursor: pointer; }
    .hud-btn:hover { background: rgba(129,140,248,0.4); }

    #worldPrompt { position: fixed; left: 50%; bottom: 8%; transform: translateX(-50%); z-index: 11; display: none; padding: 0.6rem 1.4rem; background: rgba(8,6,24,0.82); border: 1px solid rgba(252,211,77,0.6); border-radius: 999px; font-weight: 700; letter-spacing: 0.04em; cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,0.45); }
    #worldPrompt.show { display: block; }

    /* ---------- BATTLE UI ---------- */
    #battleUI { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; justify-content: space-between; padding: clamp(0.6rem,1.6vw,1.3rem); pointer-events: none; }
    body.mode-battle #battleUI { display: flex; }
    .enemies { display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap; pointer-events: auto; }
    .eplate { min-width: 160px; max-width: 240px; flex: 1 1 170px; background: linear-gradient(180deg, rgba(20,16,60,0.85), rgba(12,10,36,0.85)); border: 1px solid rgba(255,255,255,0.22); border-radius: 10px; padding: 0.5rem 0.7rem; box-shadow: 0 8px 24px rgba(0,0,0,0.45); transition: opacity 0.4s, transform 0.2s; }
    .eplate.dead { opacity: 0.3; }
    .eplate.targetable { cursor: pointer; }
    .eplate.targetable:hover { transform: translateY(-3px); border-color: #fcd34d; box-shadow: 0 8px 28px rgba(252,211,77,0.4); }
    .eplate .row { display: flex; justify-content: space-between; align-items: baseline; gap: 0.4rem; }
    .eplate .name { font-weight: 700; font-size: 0.84rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .eplate .hpnum { font-size: 0.7rem; color: rgba(255,255,255,0.65); }
    .bar { height: 9px; border-radius: 5px; background: rgba(0,0,0,0.45); overflow: hidden; margin-top: 0.35rem; border: 1px solid rgba(255,255,255,0.14); }
    .bar > i { display: block; height: 100%; transition: width 0.45s ease; }
    .bar.hp > i { background: linear-gradient(90deg, #f87171, #fca5a5); }
    .bar.php > i { background: linear-gradient(90deg, #34d399, #6ee7b7); }
    .bar.mp > i { background: linear-gradient(90deg, #60a5fa, #93c5fd); }
    .bottom { display: flex; gap: 0.8rem; align-items: flex-end; justify-content: space-between; }
    .party { pointer-events: auto; display: flex; flex-direction: column; gap: 0.4rem; min-width: 240px; max-width: 330px; flex: 1; }
    .pmember { background: linear-gradient(180deg, rgba(20,16,60,0.88), rgba(12,10,36,0.9)); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; padding: 0.45rem 0.7rem; box-shadow: 0 8px 24px rgba(0,0,0,0.45); transition: border-color 0.2s, transform 0.15s; }
    .pmember.active { border-color: #fcd34d; box-shadow: 0 0 0 1px #fcd34d, 0 8px 28px rgba(252,211,77,0.35); transform: translateX(6px); }
    .pmember.dead { opacity: 0.4; }
    .pmember.targetable { cursor: pointer; }
    .pmember.targetable:hover { border-color: #6ee7b7; }
    .pmember .row { display: flex; justify-content: space-between; align-items: baseline; }
    .pmember .name { font-weight: 700; font-size: 0.82rem; }
    .pmember .role { font-size: 0.62rem; color: rgba(255,255,255,0.5); letter-spacing: 0.1em; text-transform: uppercase; }
    .pmember .nums { font-size: 0.64rem; color: rgba(255,255,255,0.6); }
    .twobar { display: grid; grid-template-columns: 1fr auto; gap: 0.4rem; align-items: center; }
    .menu { pointer-events: auto; width: min(280px, 44vw); background: linear-gradient(180deg, rgba(20,16,60,0.92), rgba(12,10,36,0.94)); border: 1px solid rgba(255,255,255,0.26); border-radius: 12px; padding: 0.45rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .menu .title { font-size: 0.66rem; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.5); padding: 0.25rem 0.6rem 0.4rem; }
    .menu .cmd { display: flex; justify-content: space-between; align-items: center; width: 100%; text-align: left; font: inherit; font-weight: 500; color: #fff; background: transparent; border: none; border-radius: 8px; padding: 0.5rem 0.75rem; cursor: pointer; transition: background 0.12s, transform 0.06s; }
    .menu .cmd:hover:not(:disabled) { background: rgba(129,140,248,0.28); }
    .menu .cmd:active:not(:disabled) { transform: scale(0.98); }
    .menu .cmd:disabled { opacity: 0.32; cursor: not-allowed; }
    .menu .cmd .cost { font-size: 0.74rem; color: #93c5fd; }
    .menu .cmd .cost.qty { color: #fcd34d; }
    .menu .cmd.back { color: rgba(255,255,255,0.6); }
    #bMessage { position: fixed; left: 50%; bottom: 210px; transform: translateX(-50%); z-index: 11; pointer-events: none; padding: 0.5rem 1.3rem; background: rgba(8,6,24,0.78); border: 1px solid rgba(255,255,255,0.2); border-radius: 999px; font-size: clamp(0.8rem,2.2vw,1rem); max-width: 92vw; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.45); }

    .float { position: fixed; z-index: 14; pointer-events: none; font-weight: 700; font-size: 1.6rem; text-shadow: 0 2px 6px rgba(0,0,0,0.7); transform: translate(-50%,-50%); animation: floatUp 0.95s ease-out forwards; }
    @keyframes floatUp { 0%{opacity:0;transform:translate(-50%,-30%) scale(0.6);} 20%{opacity:1;transform:translate(-50%,-90%) scale(1.15);} 100%{opacity:0;transform:translate(-50%,-200%) scale(1);} }

    /* ---------- MODALS ---------- */
    .overlay { position: fixed; inset: 0; z-index: 25; display: none; align-items: center; justify-content: center; background: rgba(5,4,18,0.6); backdrop-filter: blur(4px); padding: 1rem; }
    .overlay.show { display: flex; }

    /* dialogue */
    #dialogue { z-index: 24; align-items: flex-end; justify-content: center; background: none; backdrop-filter: none; pointer-events: none; }
    #dialogue .box { pointer-events: auto; width: min(640px, 94vw); margin-bottom: 6vh; padding: 1rem 1.2rem; }
    #dlgName { font-weight: 700; color: #fcd34d; letter-spacing: 0.05em; margin-bottom: 0.4rem; }
    #dlgText { font-size: clamp(0.95rem,2.6vw,1.15rem); line-height: 1.5; min-height: 3.2em; }
    #dlgNext { margin-top: 0.8rem; float: right; }

    /* confirm */
    #confirm .box { width: min(420px, 92vw); padding: 1.4rem; text-align: center; }
    #confirmText { font-size: 1.05rem; line-height: 1.5; }
    #confirm .actions { margin-top: 1.4rem; display: flex; gap: 0.8rem; justify-content: center; }

    /* shop */
    #shop .box { width: min(560px, 94vw); max-height: 84vh; overflow: auto; padding: 1.2rem; }
    #shop .shead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    #shop h2 { font-size: 1.4rem; }
    #shopGold { color: #fde68a; font-weight: 700; }
    .shop-row { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 0.7rem 0.4rem; border-bottom: 1px solid rgba(255,255,255,0.12); }
    .shop-info { display: flex; flex-direction: column; }
    .shop-info span { font-size: 0.78rem; color: rgba(255,255,255,0.6); }
    .shop-head { font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: #fcd34d; margin: 1rem 0 0.2rem; }

    /* gear / seashells */
    #gear .sk-wrap { width: min(760px, 96vw); max-height: 90vh; overflow: auto; }
    .gear-tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .gear-tab { font: inherit; font-weight: 700; font-size: 0.82rem; padding: 0.5rem 0.9rem; border-radius: 9px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.06); color: #fff; cursor: pointer; }
    .gear-tab.on { border-color: #fcd34d; background: rgba(252,211,77,0.16); }
    .gear-body { display: flex; flex-direction: column; gap: 0.9rem; }
    .gear-stats .sk-stats { font-size: 0.78rem; }
    .gear-abil { font-size: 0.76rem; color: rgba(255,255,255,0.78); margin-top: 0.3rem; }
    .gear-abil b { color: #a5b4fc; }
    .gear-sec h3 { font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.55); margin-bottom: 0.45rem; }
    .gear-item { display: block; width: 100%; text-align: left; font: inherit; color: #fff; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.16); border-radius: 9px; padding: 0.5rem 0.7rem; margin-bottom: 0.4rem; cursor: pointer; transition: background 0.12s, border-color 0.12s; }
    .gear-item:hover:not(:disabled) { background: rgba(129,140,248,0.28); }
    .gear-item:disabled { opacity: 0.5; cursor: default; }
    .gear-item.on { border-color: #6ee7b7; background: rgba(52,211,153,0.14); }
    .gi-top { display: flex; justify-content: space-between; font-weight: 700; font-size: 0.86rem; }
    .gi-tag { font-size: 0.72rem; color: #fcd34d; }
    .gear-item.on .gi-tag { color: #6ee7b7; }
    .gi-desc { font-size: 0.72rem; color: rgba(255,255,255,0.68); margin-top: 0.2rem; }
    .slot-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .slot { display: flex; align-items: center; gap: 0.4rem; font: inherit; font-size: 0.82rem; font-weight: 600; color: #fff; background: rgba(255,255,255,0.05); border: 1px dashed rgba(255,255,255,0.3); border-radius: 999px; padding: 0.45rem 0.9rem; cursor: pointer; }
    .slot.filled { border-style: solid; border-color: rgba(129,140,248,0.6); background: rgba(129,140,248,0.16); }
    .slot:disabled { opacity: 0.6; cursor: default; }
    .slot-lv { font-size: 0.66rem; color: #fcd34d; }
    .shell-dot { width: 0.7rem; height: 0.7rem; border-radius: 50%; display: inline-block; }
    .shell-dot.magic { background: radial-gradient(circle at 35% 30%, #fff, #6366f1); }
    .shell-dot.support { background: radial-gradient(circle at 35% 30%, #fff, #34d399); }

    /* result (battle end) */
    #bResult { z-index: 16; }
    #bResult .box { width: min(460px, 92vw); padding: 1.6rem; text-align: center; }
    #bResultTitle { font-size: clamp(2rem,8vw,3.4rem); font-weight: 700; background: linear-gradient(120deg, #a5b4fc, #f0abfc, #5eead4); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    #bResultText { margin-top: 0.8rem; line-height: 1.6; color: rgba(255,255,255,0.85); }
    #bResultBtn { margin-top: 1.5rem; }

    /* skills */
    #skills .sk-wrap { width: min(1000px, 96vw); max-height: 90vh; overflow: auto; }
    .sk-head { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
    .sk-head h2 { font-size: 1.5rem; flex: 0 0 auto; }
    .sk-gold { color: #fde68a; font-weight: 700; flex: 1; }
    .sk-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0.9rem; }
    .sk-col { background: rgba(12,10,36,0.6); border: 1px solid rgba(255,255,255,0.16); border-radius: 12px; padding: 0.8rem; }
    .sk-name { font-weight: 700; }
    .sk-role { font-size: 0.66rem; color: rgba(255,255,255,0.5); letter-spacing: 0.1em; text-transform: uppercase; }
    .sk-stats { font-size: 0.72rem; color: rgba(255,255,255,0.7); margin: 0.4rem 0; line-height: 1.4; }
    .sk-xp { height: 6px; border-radius: 4px; background: rgba(0,0,0,0.4); overflow: hidden; }
    .sk-xp > i { display: block; height: 100%; background: linear-gradient(90deg,#fcd34d,#fbbf24); }
    .sk-xptxt { font-size: 0.66rem; color: rgba(255,255,255,0.5); margin: 0.2rem 0 0.6rem; }
    .sk-nodes { display: flex; flex-direction: column; gap: 0.4rem; }
    .sk-node { text-align: left; font: inherit; color: #fff; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.16); border-radius: 9px; padding: 0.5rem 0.6rem; cursor: pointer; transition: background 0.12s, border-color 0.12s; }
    .sk-node:hover:not(:disabled) { background: rgba(129,140,248,0.28); }
    .sk-node:disabled { cursor: default; }
    .sk-node.learned { border-color: #6ee7b7; background: rgba(52,211,153,0.14); }
    .sk-node.locked { opacity: 0.5; }
    .sk-node-top { display: flex; justify-content: space-between; font-weight: 700; font-size: 0.85rem; }
    .sk-cost { color: #fcd34d; }
    .sk-node.learned .sk-cost { color: #6ee7b7; }
    .sk-desc { font-size: 0.72rem; color: rgba(255,255,255,0.7); margin-top: 0.2rem; }
    .sk-desc em { color: #fca5a5; font-style: normal; }

    /* toast */
    #toast { position: fixed; left: 50%; top: 14%; transform: translateX(-50%); z-index: 27; max-width: 90vw; text-align: center; padding: 0.7rem 1.4rem; background: rgba(8,6,24,0.9); border: 1px solid rgba(255,255,255,0.25); border-radius: 12px; font-size: 0.92rem; opacity: 0; transition: opacity 0.3s, transform 0.3s; pointer-events: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    #toast.show { opacity: 1; }

    /* ending */
    #end { z-index: 28; flex-direction: column; text-align: center; }
    #end .box { background: none; border: none; box-shadow: none; max-width: 600px; }
    #endTitle { font-size: clamp(2.4rem,10vw,5rem); font-weight: 700; background: linear-gradient(120deg, #a5b4fc, #f0abfc, #5eead4); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    #endText { margin-top: 0.8rem; color: rgba(255,255,255,0.85); line-height: 1.6; }
    #end .actions { margin-top: 2rem; display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }

    /* redesigned skill trees */
    #skills .sk-wrap { width: min(960px, 96vw); }
    #partyScr .sk-wrap { width: min(900px, 96vw); max-height: 90vh; overflow: auto; }
    .sk-block { background: linear-gradient(180deg, rgba(18,20,40,0.7), rgba(10,12,28,0.7)); border: 1px solid rgba(255,255,255,0.14); border-radius: 14px; padding: 0.9rem 1rem; margin-bottom: 1rem; }
    .sk-bhead { display: flex; justify-content: space-between; align-items: baseline; }
    .sk-bhead .sk-name { font-size: 1.05rem; font-weight: 700; }
    .sk-sp { font-size: 0.85rem; color: rgba(255,255,255,0.75); }
    .sk-sp b { color: #fcd34d; }
    .sk-bstats { font-size: 0.72rem; color: rgba(255,255,255,0.6); margin: 0.3rem 0 0.5rem; }
    .sk-tree { position: relative; width: 100%; }
    .sk-svg { position: absolute; inset: 0; width: 100%; }
    .sk-line { stroke: rgba(255,255,255,0.18); stroke-width: 3; }
    .sk-line.on { stroke: #6ee7b7; stroke-width: 4; filter: drop-shadow(0 0 4px rgba(110,231,183,0.8)); }
    .sk-n { position: absolute; transform: translate(-50%, -50%); width: 150px; display: flex; flex-direction: column; align-items: center; gap: 0.1rem; padding: 0.5rem 0.4rem; border-radius: 12px; font: inherit; color: #fff; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); background: rgba(30,28,55,0.92); transition: transform 0.1s, box-shadow 0.2s; z-index: 2; }
    .sk-n:hover:not(:disabled) { transform: translate(-50%,-50%) scale(1.06); }
    .sk-n:disabled { cursor: default; }
    .sk-n-ic { font-size: 1.1rem; line-height: 1; }
    .sk-n.ability .sk-n-ic { color: #f0abfc; }
    .sk-n.stat .sk-n-ic { color: #93c5fd; }
    .sk-n-name { font-weight: 700; font-size: 0.78rem; text-align: center; }
    .sk-n-sub { font-size: 0.66rem; color: #fcd34d; }
    .sk-n.learned { border-color: #6ee7b7; background: rgba(52,211,153,0.2); box-shadow: 0 0 14px rgba(52,211,153,0.45); }
    .sk-n.learned .sk-n-sub { color: #6ee7b7; }
    .sk-n.avail { border-color: #fcd34d; box-shadow: 0 0 0 1px #fcd34d, 0 0 18px rgba(252,211,77,0.5); animation: skpulse 1.6s ease-in-out infinite; }
    @keyframes skpulse { 0%,100%{ box-shadow: 0 0 0 1px #fcd34d, 0 0 10px rgba(252,211,77,0.35); } 50%{ box-shadow: 0 0 0 1px #fcd34d, 0 0 22px rgba(252,211,77,0.7); } }
    .sk-n.locked { opacity: 0.45; }

    /* party roster cards */
    .roster-card { text-align: left; font: inherit; color: #fff; background: rgba(18,20,40,0.7); border: 1px solid rgba(255,255,255,0.16); border-radius: 12px; padding: 0.8rem; cursor: pointer; transition: border-color 0.15s, transform 0.1s, box-shadow 0.2s; }
    .roster-card:hover { transform: translateY(-2px); }
    .roster-card.on { border-color: #fcd34d; box-shadow: 0 0 0 1px #fcd34d, 0 8px 26px rgba(252,211,77,0.3); background: rgba(252,211,77,0.1); }
    .rc-top { display: flex; justify-content: space-between; align-items: baseline; }
    .rc-name { font-weight: 700; font-size: 1rem; }
    .rc-tag { font-size: 0.66rem; letter-spacing: 0.1em; color: rgba(255,255,255,0.5); }
    .roster-card.on .rc-tag { color: #fcd34d; }
    .rc-role { font-size: 0.72rem; color: rgba(255,255,255,0.6); margin: 0.2rem 0 0.4rem; }
    .rc-weap { font-size: 0.74rem; color: #93c5fd; margin-top: 0.3rem; }

    /* portraits */
    .portrait { image-rendering: pixelated; image-rendering: crisp-edges; width: 38px; height: 38px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.25); display: block; }
    .pm-head { display: flex; gap: 0.5rem; align-items: center; }
    .pm-port { width: 44px; height: 44px; flex: 0 0 auto; }
    .pm-meta { flex: 1; min-width: 0; }
    .pmember.limitready { box-shadow: 0 0 0 1px #fde047, 0 0 16px rgba(253,224,71,0.6); }
    .bar.lim { height: 5px; }
    .bar.lim > i { background: linear-gradient(90deg, #fcd34d, #fde047); }
    .eplate.boss { display: flex; gap: 0.5rem; align-items: center; }
    .eplate .einfo { flex: 1; min-width: 0; }
    .eportrait img { width: 46px; height: 46px; }
    .cmd .cost.lim { color: #fde047; }

    /* dialogue portrait */
    .dlg-row { display: flex; gap: 0.8rem; align-items: flex-start; }
    .dlg-port { flex: 0 0 auto; }
    .dlg-port img { width: 58px; height: 58px; image-rendering: pixelated; border-radius: 8px; }
    .dlg-body { flex: 1; }

    /* ship battle */
    #shipUI { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; justify-content: space-between; padding: clamp(0.6rem,1.6vw,1.3rem); pointer-events: none; }
    body.mode-shipbattle #shipUI { display: flex; }
    #shipUI .topbar { display: flex; justify-content: center; }
    #shipMsg { position: fixed; left: 50%; bottom: 210px; transform: translateX(-50%); z-index: 11; pointer-events: none; padding: 0.5rem 1.3rem; background: rgba(8,6,24,0.78); border: 1px solid rgba(255,255,255,0.2); border-radius: 999px; font-size: clamp(0.8rem,2.2vw,1rem); max-width: 92vw; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.45); display: none; }
    body.mode-shipbattle #shipMsg { display: block; }

    /* shipyard */
    #shipyard .sk-wrap { width: min(640px, 96vw); max-height: 90vh; overflow: auto; }
    .ship-preview { display: flex; gap: 1rem; align-items: center; background: rgba(12,10,36,0.5); border: 1px solid rgba(255,255,255,0.14); border-radius: 12px; padding: 0.9rem; margin-bottom: 1rem; }
    .ship-art { position: relative; width: 96px; height: 76px; flex: 0 0 auto; }
    .ship-hull { position: absolute; bottom: 0; left: 6px; width: 84px; height: 28px; border-radius: 0 0 44px 44px; }
    .ship-sail { position: absolute; bottom: 26px; left: 40px; width: 16px; height: 40px; border-radius: 3px; }
    .ship-flag { position: absolute; top: -4px; left: 44px; font-size: 1.2rem; }
    .ship-stats { font-size: 0.9rem; line-height: 1.6; }

    /* shell hunt */
    .sh-panel { width: min(560px, 96vw); padding: 1.2rem; }
    .sh-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; }
    .sh-hud { font-weight: 700; color: #fde68a; }
    .sh-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
    .sh-cell { aspect-ratio: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
    .sh-shell { font: inherit; font-size: 1.9rem; background: none; border: none; cursor: pointer; line-height: 1; animation: shellpop 0.14s ease; }
    .sh-shell.caught { animation: shellcatch 0.14s ease forwards; }
    @keyframes shellpop { from { transform: scale(0); } to { transform: scale(1); } }
    @keyframes shellcatch { to { transform: scale(1.7); opacity: 0; } }
    .sh-foot { margin-top: 0.8rem; text-align: center; color: rgba(255,255,255,0.6); font-size: 0.82rem; }
    .sh-result { text-align: center; line-height: 1.7; margin: 1rem 0; }

    /* dating sim */
    .date-box { width: min(560px, 96vw); padding: 1.2rem; }
    .date-head { display: flex; gap: 0.9rem; align-items: center; margin-bottom: 0.8rem; }
    .date-port { width: 84px; height: 84px; border-radius: 10px; }
    .date-name { font-weight: 700; font-size: 1.2rem; }
    .date-el { font-size: 0.8rem; font-weight: 700; margin-left: 0.4rem; }
    .date-hearts { font-size: 1.1rem; margin-top: 0.3rem; letter-spacing: 0.1em; }
    .date-text { font-size: clamp(0.95rem, 2.6vw, 1.1rem); line-height: 1.55; min-height: 3em; margin-bottom: 1rem; }
    .date-intro { color: #fff; }
    .date-hint { color: #93c5fd; font-size: 0.82rem; margin-top: 0.5rem; }
    .date-opts { display: flex; flex-direction: column; gap: 0.5rem; }
    .date-opt { text-align: left; justify-content: flex-start; text-transform: none; letter-spacing: 0.01em; font-weight: 500; }
    .date-opt .portrait.mini, .portrait.mini { width: 22px; height: 22px; display: inline-block; vertical-align: middle; border-radius: 4px; margin-right: 0.3rem; }

    /* battle transition */
    #transition { position: fixed; inset: 0; z-index: 40; pointer-events: none; opacity: 0; }
    #transition.show { animation: battleWipe 0.8s ease forwards; }
    @keyframes battleWipe {
      0% { opacity: 0; clip-path: circle(0% at 50% 50%); background: #0a0a18; }
      22% { opacity: 1; clip-path: circle(170% at 50% 50%); background: #0a0a18; }
      44% { opacity: 1; background: #ffffff; }
      60% { opacity: 1; background: #ffffff; }
      100% { opacity: 0; background: #ffffff; }
    }

    @media (max-width: 680px) {
      #bMessage { bottom: 188px; }
      .hud-m { min-width: 78px; }
      .hud-btn { padding: 0.4rem 0.55rem; font-size: 0.72rem; }
      #start h1 { font-size: 3rem; }
      .sk-n { width: 116px; }
    }
  </style>
</head>

  <!-- SHIP BATTLE -->

  <!-- SHOP -->
  <div class="overlay" id="shop"><div class="box panel"><div class="shead"><h2>🛒 Shop</h2><span id="shopGold">⛃ 0</span><button class="pill ghost small" id="shopClose">Close</button></div><div id="shopList"></div></div></div>
