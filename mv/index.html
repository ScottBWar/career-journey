<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TIDEFALL — a 2.5D Metroidvania</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #05060c; font-family: 'Trebuchet MS', system-ui, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; }
    #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: auto; touch-action: none; }
    #hud { position: fixed; top: 12px; left: 12px; z-index: 5; pointer-events: none; }
    #hp { display: flex; gap: 5px; }
    #hp .pip { width: 22px; height: 22px; border-radius: 5px; background: #e23a4a; box-shadow: inset 0 0 0 2px rgba(255,255,255,0.25); }
    #hp .pip.empty { background: rgba(255,255,255,0.12); }
    #room { margin-top: 8px; font-size: 0.8rem; letter-spacing: 0.18em; color: rgba(255,255,255,0.6); text-transform: uppercase; }
    #abilities { margin-top: 6px; font-size: 0.75rem; color: #7fe0ff; }
    #toast { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); z-index: 6; background: rgba(8,10,24,0.85); border: 1px solid rgba(150,185,255,0.5); padding: 0.7rem 1.4rem; border-radius: 10px; font-size: 0.95rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    #toast.show { opacity: 1; }
    #start { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: radial-gradient(circle at 50% 35%, #14224a, #05060c 75%); }
    #start h1 { font-size: clamp(3rem, 12vw, 7rem); font-weight: 800; letter-spacing: 0.04em; background: linear-gradient(120deg, #7fe0ff, #a5b4fc, #5eead4); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    #start p { margin-top: 0.6rem; color: rgba(255,255,255,0.7); }
    #start .keys { margin-top: 1rem; font-size: 0.85rem; color: rgba(255,255,255,0.5); line-height: 1.7; }
    #start button { margin-top: 1.8rem; font: inherit; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.9rem 2.4rem; border: none; border-radius: 999px; cursor: pointer; color: #05060c; background: linear-gradient(120deg, #7fe0ff, #5eead4); }
    /* on-screen touch controls */
    #touch { position: fixed; inset: 0; z-index: 4; display: none; pointer-events: none; }
    body.touch #touch { display: block; }
    .tbtn { position: fixed; bottom: 24px; width: 72px; height: 72px; border-radius: 50%; background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.25); pointer-events: auto; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; }
    #tleft { left: 20px; } #tright { left: 110px; } #tjump { right: 24px; bottom: 40px; } #tact { right: 110px; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud"><div id="hp"></div><div id="room"></div><div id="abilities"></div></div>
  <div id="toast"></div>

  <div id="touch">
    <div class="tbtn" id="tleft">◀</div>
    <div class="tbtn" id="tright">▶</div>
    <div class="tbtn" id="tact">↑</div>
    <div class="tbtn" id="tjump">⤒</div>
  </div>

  <div id="start">
    <h1>TIDEFALL</h1>
    <p>A 2.5D metroidvania · vertical slice</p>
    <div class="keys">← → / A D — move &nbsp;·&nbsp; Z / Space / ↑ — jump (double-jump once unlocked)<br>↑ / W at a door — enter &nbsp;·&nbsp; the world is yours to explore</div>
    <button id="startBtn">Begin</button>
  </div>

  <script src="js/loader.js"></script>
  <script src="js/input.js"></script>
  <script src="js/world.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
