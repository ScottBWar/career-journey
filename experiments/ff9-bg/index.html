<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FF9 Field POC — Beach Town</title>
<style>
  html, body { margin: 0; height: 100%; background: #07070d; overflow: hidden;
    font-family: ui-monospace, Menlo, Consolas, monospace; color: #fff; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #cv { max-width: 100vw; max-height: 100vh; image-rendering: auto;
    box-shadow: 0 0 60px rgba(0,0,0,0.8); }
  #hud { position: fixed; left: 14px; top: 12px; font-size: 13px; line-height: 1.5;
    background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 8px; pointer-events: none; }
  #hud b { color: #ffd23f; }
  #tip { position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%);
    background: rgba(10,8,20,0.82); border: 1px solid rgba(255,255,255,0.25);
    padding: 8px 16px; border-radius: 999px; font-size: 15px; opacity: 0;
    transition: opacity 0.15s; pointer-events: none; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    max-width: 80vw; text-align: center; background: rgba(10,8,20,0.88);
    border: 1px solid rgba(255,210,120,0.4); padding: 10px 18px; border-radius: 10px;
    font-size: 15px; opacity: 0; transition: opacity 0.25s; pointer-events: none; }
  #err { display: none; position: fixed; inset: 0; align-items: center; justify-content: center;
    text-align: center; font-size: 15px; padding: 40px; }
</style>
</head>
<body>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="hud"><b>WASD / arrows</b> — move &nbsp;·&nbsp; <b>F</b> — interact &nbsp;·&nbsp; <b>G</b> — show field logic</div>
  <div id="tip"></div>
  <div id="toast"></div>
  <div id="err">
    Couldn't load <code>assets/beach-town.png</code>.<br><br>
    Open this via a local server so the browser can read the image:<br>
    <code>cd experiments/ff9-bg &amp;&amp; npx serve</code> &nbsp;(or <code>python3 -m http.server</code>)<br>
    then visit the printed URL.
  </div>
  <script src="app.js"></script>
</body>
</html>
